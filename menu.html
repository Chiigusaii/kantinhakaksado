<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#272833" />
<title>Urus Menu — Kantin Dapo Hakaksado</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="app.css" />
<style>
  .addbar{display:grid;grid-template-columns:5rem minmax(0,2fr) 9rem minmax(0,1.4fr) auto;gap:.7rem;align-items:end}
  .photo-pick{
    width:5rem;height:5rem;border-radius:var(--r-md);border:1px dashed var(--line);
    background:rgba(255,255,255,.05);display:grid;place-items:center;font-size:1.9rem;cursor:pointer;
    overflow:hidden;position:relative;color:var(--muted);
    transition:background .2s,border-color .2s,transform .15s var(--ease)
  }
  .photo-pick:hover{background:rgba(255,255,255,.1);border-color:var(--orange-2);transform:translateY(-2px)}
  .photo-pick:active{transform:scale(.95)}
  .photo-pick img{width:100%;height:100%;object-fit:cover}
  .photo-pick input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
  .photo-pick .lbl{position:absolute;font-size:.55rem;font-weight:800;bottom:0;left:0;right:0;text-align:center;background:rgba(0,0,0,.6);color:#fff;padding:.15rem 0}
  .rowi .thumb-btn{
    width:3.4rem;height:3.4rem;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--line);
    background:rgba(255,255,255,.05);display:grid;place-items:center;font-size:1.5rem;cursor:pointer;flex:none;
    transition:transform .15s var(--ease),border-color .2s
  }
  .rowi .thumb-btn:hover{transform:scale(1.07);border-color:var(--orange-2)}
  .rowi .thumb-btn:active{transform:scale(.94)}
  .rowi .thumb-btn img{width:100%;height:100%;object-fit:cover}
  .price{position:relative}
  .price .input{padding-left:2.9rem}
  .price span{position:absolute;left:1rem;bottom:1rem;font-size:.85rem;color:var(--muted);font-weight:800}
  .cats{display:flex;gap:.55rem;flex-wrap:wrap;align-items:center}
  .cats .chip i{display:inline-block;width:.6rem;height:.6rem;border-radius:50%;margin-right:.5rem;background:var(--c)}
  .cats .chip small{color:var(--muted);margin-left:.4rem}
  .listbar{display:flex;justify-content:space-between;align-items:center;gap:.7rem;flex-wrap:wrap;margin:1.5rem 0 .25rem}
  .listbar .input{width:min(24rem,100%)}
  .save-state{font-size:.88rem;color:var(--muted);font-weight:800}
  .group{margin-top:1.3rem}
  .group h3{font-size:1rem;font-weight:800;display:flex;align-items:center;gap:.55rem;margin-bottom:.4rem}
  .group h3 i{width:.7rem;height:.7rem;border-radius:50%;background:var(--c)}
  .group h3 small{color:var(--muted);font-weight:700;font-size:.85rem}
  .rowi{
    display:grid;grid-template-columns:3.4rem minmax(0,2fr) 9rem minmax(0,1.3fr) auto;
    grid-template-areas:"t n p c a";gap:.6rem;align-items:center;padding:.55rem 0
  }
  .rowi+.rowi{border-top:1px solid var(--line)}
  .rowi .input{padding:.7rem .85rem;font-size:1rem;min-height:3.2rem}
  .rowi .t{grid-area:t}.rowi .n{grid-area:n}.rowi .p{grid-area:p}.rowi .c{grid-area:c}.rowi .a{grid-area:a}
  .rowi .p .input{padding-left:2.7rem}
  .rowi .p span{bottom:.85rem}
  .rowi .input.bad{border-color:var(--red)}
  .acts{display:flex;gap:.3rem;justify-content:flex-end}
  .acts button{
    width:3.1rem;height:3.1rem;border-radius:var(--r-sm);border:1px solid var(--line);
    background:rgba(255,255,255,.06);color:#fff;cursor:pointer;display:grid;place-items:center;
    font-weight:800;font-size:1.05rem;transition:background .15s,transform .12s
  }
  .acts button:hover{background:rgba(255,255,255,.14)}
  .acts button:active{transform:scale(.9)}
  .acts button:disabled{opacity:.25;cursor:default;background:rgba(255,255,255,.06);transform:none}
  .acts .del{color:#ffb3af;border-color:rgba(240,98,92,.3);background:rgba(240,98,92,.1)}
  .acts .del:hover{background:rgba(240,98,92,.22)}
  @media (max-width:900px){
    .addbar{grid-template-columns:5rem 1fr 1fr}
    .addbar .btn{grid-column:1/-1}
    .rowi{grid-template-columns:3.4rem minmax(0,1fr) 8rem;grid-template-areas:"t n n" "t p c" "a a a";padding:.8rem 0}
    .acts{justify-content:flex-start}
  }
</style>
</head>
<body>
<aside class="rail" aria-label="Navigasi">
  <nav>
    <a class="nav" href="index.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg><span data-i18n="nav.home">Utama</span></a>
    <a class="nav" href="foodmenu.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg><span data-i18n="nav.counter">Kaunter</span></a>
    <a class="nav" href="salesdata.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg><span data-i18n="nav.reports">Laporan</span></a>
    <a class="nav active" aria-current="page" href="menu.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><circle cx="7" cy="7" r="1"/></svg><span data-i18n="nav.menu">Menu</span></a>
    <a class="nav" href="settings.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span data-i18n="nav.settings">Tetapan</span></a>
  </nav>
</aside>

<main>
  <div class="head">
    <div>
      <div class="brand" id="brand">Kantin Dapo Hakaksado</div>
      <h1 data-i18n-html="menuPage.title"><b>Urus</b> Menu &amp; Harga</h1>
    </div>
    <div class="head-right">
      <a id="syncBadge" class="sync" href="settings.html"><i></i>Memuatkan…</a>
      <div class="clock"><span id="today">—</span><b id="now">--:--:--</b></div>
    </div>
  </div>

  <section class="panel">
    <h2 data-i18n="menuPage.addSection">Tambah item baru</h2>
    <form class="addbar" id="addForm">
      <div class="field"><span style="font-size:0;height:0;display:block" aria-hidden="true"> </span>
        <div class="photo-pick" id="newImgPick" data-i18n-title="menuPage.imageLabel" title="Gambar">
          <span id="newImgPreview">🍽️</span>
          <input type="file" id="newImgFile" accept="image/*" aria-label="Muat naik gambar">
        </div>
      </div>
      <label class="field" data-i18n="menuPage.nameLabel">Nama makanan / minuman<input class="input" id="newName" type="text" data-i18n-placeholder="menuPage.namePlaceholder" placeholder="cth. Nasi Goreng Kampung" maxlength="60" required></label>
      <label class="field price" data-i18n="menuPage.priceLabel">Harga<input class="input" id="newPrice" type="number" step="0.01" min="0" inputmode="decimal" placeholder="0.00" required><span>RM</span></label>
      <label class="field" data-i18n="menuPage.catLabel">Kategori<select class="input" id="newCat"></select></label>
      <button class="btn primary" type="submit" data-i18n="menuPage.addItemBtn">Tambah item</button>
    </form>
  </section>

  <section class="panel" style="margin-top:16px">
    <h2><span data-i18n="menuPage.catsTitle">Kategori</span> <small data-i18n="menuPage.catsHint">klik untuk tukar nama atau padam</small></h2>
    <div class="cats" id="cats"></div>
  </section>

  <div class="listbar">
    <input class="input" id="q" type="search" data-i18n-placeholder="menuPage.searchPlaceholder" placeholder="Cari item…" autocomplete="off">
    <span class="save-state" id="saveState"></span>
  </div>
  <div id="list"></div>
</main>

<script src="config.js"></script>
<script src="menu-default.js"></script>
<script src="i18n.js"></script>
<script src="db.js"></script>
<script>
const H = KantinDB.h, { rm, money, esc, startClock, toast } = H;
const { t } = I18N;
startClock('today', 'now');
document.getElementById('brand').textContent = KantinDB.state.shopName;
const $ = id => document.getElementById(id);
let MENU = { cats: [], items: [], updatedAt: 0 }, dirty = false, lastSavedAt = 0, timer = null, q = '';
const catColor = c => { const i = MENU.cats.indexOf(c); return KantinDB.catStyle(c, i < 0 ? 0 : i).c2; };
const catEmoji = c => { const i = MENU.cats.indexOf(c); return KantinDB.catStyle(c, i < 0 ? 0 : i).emoji; };
const count = c => MENU.items.filter(it => it.cat === c).length;
let newImg = '';

/* ---------------- new-item photo picker */
function refreshNewImgPreview() {
  const box = $('newImgPreview');
  if (newImg) box.innerHTML = `<img src="${esc(newImg)}" alt="">`;
  else box.textContent = catEmoji($('newCat').value) || '🍽️';
}
$('newImgFile').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  $('newImgPreview').textContent = '…';
  try { newImg = await H.compressImage(f); refreshNewImgPreview(); }
  catch (err) { toast(t('menuPage.imageTooBig'), 'err'); refreshNewImgPreview(); }
  e.target.value = '';
});
$('newImgPick').addEventListener('click', e => { if (e.target.closest('input[type=file]')) return; });
$('newImgPick').addEventListener('contextmenu', async e => {
  e.preventDefault();
  if (newImg) { newImg = ''; refreshNewImgPreview(); return; }
});
$('newCat').addEventListener('change', async e => {
  if (e.target.value === '__new') { const name = await newCategory(); renderCatSelect(e.target, name || MENU.cats[0]); }
  if (!newImg) refreshNewImgPreview();
});

/* ---------------- saving */
async function save() {
  clearTimeout(timer); dirty = false;
  $('saveState').textContent = t('menuPage.saving');
  try {
    const m = await KantinDB.saveMenu(MENU);
    lastSavedAt = m.updatedAt; MENU.updatedAt = m.updatedAt;
    $('saveState').textContent = t('menuPage.saved');
  } catch (e) { $('saveState').textContent = t('menuPage.saveFailed'); toast(t('menuPage.saveFailed'), 'err'); }
}
function scheduleSave() {
  if (MENU.items.some(it => !it.name.trim())) { $('saveState').textContent = t('menuPage.nameEmpty'); return; }
  dirty = true; $('saveState').textContent = t('menuPage.unsaved');
  clearTimeout(timer); timer = setTimeout(save, 700);
}
window.addEventListener('beforeunload', e => { if (dirty) { save(); } });

/* ---------------- image editor for existing rows */
async function editItemImage(it) {
  const m = H.modal(`<h3>${esc(it.name)}</h3>
    <div class="d-block" style="text-align:center;margin:14px 0">
      <div class="photo-pick" id="editPreview" style="width:96px;height:96px;font-size:2.2rem;margin:0 auto">${it.img ? `<img src="${esc(it.img)}" alt="">` : esc(catEmoji(it.cat))}</div>
    </div>
    <div class="actions" style="justify-content:center;flex-wrap:wrap">
      <label class="btn sm" style="cursor:pointer">${t('menuPage.uploadImage')}<input type="file" id="editFile" accept="image/*" style="position:absolute;width:1px;height:1px;opacity:0"></label>
      <button type="button" class="btn sm" id="editUrl">${t('menuPage.useUrl')}</button>
      ${it.img ? `<button type="button" class="btn sm danger" id="editRemove">${t('menuPage.removeImage')}</button>` : ''}
      <button type="button" class="btn sm primary" id="editClose">${t('common.close')}</button>
    </div>`);
  const preview = m.back.querySelector('#editPreview');
  m.back.querySelector('#editFile').addEventListener('change', async e => {
    const f = e.target.files[0]; if (!f) return;
    preview.textContent = '…';
    try { it.img = await H.compressImage(f); await save(); render(); m.close(); }
    catch (err) { toast(t('menuPage.imageTooBig'), 'err'); preview.innerHTML = it.img ? `<img src="${esc(it.img)}" alt="">` : esc(catEmoji(it.cat)); }
  });
  m.back.querySelector('#editUrl').onclick = async () => {
    const v = await H.prompt({ title: t('menuPage.urlPromptTitle'), label: t('menuPage.urlPromptLabel'), value: it.img && it.img.startsWith('http') ? it.img : '', ok: t('common.save') });
    if (v == null) return;
    const url = v.trim();
    if (url) { it.img = url; await save(); render(); }
    m.close();
  };
  const rm2 = m.back.querySelector('#editRemove'); if (rm2) rm2.onclick = async () => { it.img = ''; await save(); render(); m.close(); };
  m.back.querySelector('#editClose').onclick = m.close;
}

/* ---------------- rendering */
function renderCatSelect(sel, value) {
  sel.innerHTML = MENU.cats.map(c => `<option value="${esc(c)}"${c === value ? ' selected' : ''}>${esc(c)}</option>`).join('') + `<option value="__new">${t('menuPage.newCatOption')}</option>`;
}
function render() {
  const prevCat = $('newCat').value;
  renderCatSelect($('newCat'), MENU.cats.includes(prevCat) ? prevCat : MENU.cats[0]);
  refreshNewImgPreview();
  $('cats').innerHTML = MENU.cats.map(c => `<button class="chip" type="button" data-cat="${esc(c)}" style="--c:${catColor(c)}"><i></i>${esc(c)}<small>${count(c)}</small></button>`).join('') + `<button class="chip" type="button" id="addCat">${t('menuPage.addCatChip')}</button>`;
  const needle = q.trim().toLowerCase();
  let html = '';
  MENU.cats.forEach(c => {
    const items = MENU.items.filter(it => it.cat === c && (!needle || it.name.toLowerCase().includes(needle)));
    if (!items.length && needle) return;
    html += `<section class="group panel fade-up"><h3 style="--c:${catColor(c)}"><i></i>${esc(c)}<small>${t('menuPage.itemCount', { n: items.length })}</small></h3>` +
      (items.length ? items.map(it => {
        const same = MENU.items.filter(x => x.cat === c), pos = same.indexOf(it);
        const thumb = it.img ? `<img src="${esc(it.img)}" alt="">` : esc(catEmoji(it.cat));
        return `<div class="rowi" data-id="${esc(it.id)}">
          <button type="button" class="thumb-btn t" data-img title="${esc(t('menuPage.imageLabel'))}">${thumb}</button>
          <div class="n"><input class="input" data-f="name" type="text" value="${esc(it.name)}" maxlength="60" aria-label="${t('menuPage.nameLabel')}"></div>
          <div class="p price"><input class="input" data-f="price" type="number" step="0.01" min="0" inputmode="decimal" value="${it.price.toFixed(2)}" aria-label="${t('menuPage.priceLabel')}"><span>RM</span></div>
          <div class="c"><select class="input" data-f="cat" aria-label="${t('menuPage.catLabel')}"></select></div>
          <div class="a acts"><button type="button" data-up title="${t('menuPage.up')}" ${pos === 0 ? 'disabled' : ''}>▲</button><button type="button" data-down title="${t('menuPage.down')}" ${pos === same.length - 1 ? 'disabled' : ''}>▼</button><button type="button" class="del" data-del title="${t('menuPage.delete')}">×</button></div>
        </div>`;
      }).join('') : `<div class="empty">${t('menuPage.emptyCat')}</div>`) + '</section>';
  });
  $('list').innerHTML = html || `<div class="empty"><b>${t('menuPage.emptyAllTitle')}</b>${t('menuPage.emptyAllDesc')}</div>`;
  $('list').querySelectorAll('.rowi').forEach(row => { const it = MENU.items.find(x => x.id === row.dataset.id); renderCatSelect(row.querySelector('select'), it.cat); });
}

/* ---------------- add item */
async function newCategory() {
  const v = await H.prompt({ title: t('menuPage.newCatTitle'), label: t('menuPage.newCatLabel'), placeholder: t('menuPage.newCatPlaceholder'), ok: t('common.add') });
  if (v == null) return null;
  const name = v.trim(); if (!name) return null;
  const exists = MENU.cats.find(c => c.toLowerCase() === name.toLowerCase());
  if (exists) { toast(t('menuPage.catExists')); return exists; }
  MENU.cats.push(name); await save(); render(); toast(t('menuPage.catAdded'), 'ok');
  return name;
}
$('addForm').addEventListener('submit', async e => {
  e.preventDefault();
  const name = $('newName').value.trim(), price = money($('newPrice').value), cat = $('newCat').value;
  if (!name) { toast(t('menuPage.enterName'), 'err'); return; }
  if (!(price >= 0) || $('newPrice').value === '') { toast(t('menuPage.enterPrice'), 'err'); return; }
  if (!cat || cat === '__new') { toast(t('menuPage.pickCat'), 'err'); return; }
  if (MENU.items.some(it => it.cat === cat && it.name.toLowerCase() === name.toLowerCase())) { toast(t('menuPage.itemExists', { name, cat }), 'err'); return; }
  MENU.items.push({ id: H.uid('m'), name, price, cat, img: newImg });
  await save(); render();
  $('newName').value = ''; $('newPrice').value = ''; newImg = ''; refreshNewImgPreview(); $('newName').focus();
  toast(t('menuPage.itemAdded', { name }), 'ok');
});

/* ---------------- categories */
$('cats').addEventListener('click', async e => {
  if (e.target.closest('#addCat')) { await newCategory(); return; }
  const b = e.target.closest('[data-cat]'); if (!b) return;
  const cat = b.dataset.cat, n = count(cat);
  const m = H.modal(`<h3>${esc(cat)}</h3><p>${t('menuPage.catItemsCount', { n })}</p>
    <form style="margin-top:14px"><label class="field">${t('menuPage.catNameLabel')}<input class="input" id="catName" type="text" value="${esc(cat)}" maxlength="40"></label>
    <div class="actions"><button type="button" class="btn danger" data-del ${n ? `disabled title="${esc(t('menuPage.moveFirstHint'))}"` : ''}>${t('menuPage.deleteCat')}</button><button type="button" class="btn" data-x>${t('common.cancel')}</button><button type="submit" class="btn primary">${t('common.save')}</button></div></form>
    ${n ? `<p style="margin-top:10px;font-size:.76rem">${t('menuPage.moveFirstNote')}</p>` : ''}`);
  m.back.querySelector('[data-x]').onclick = m.close;
  m.back.querySelector('form').onsubmit = async ev => {
    ev.preventDefault();
    const name = m.back.querySelector('#catName').value.trim();
    if (!name) return;
    if (name !== cat && MENU.cats.some(c => c.toLowerCase() === name.toLowerCase())) { toast(t('menuPage.catNameUsed'), 'err'); return; }
    MENU.cats = MENU.cats.map(c => c === cat ? name : c);
    MENU.items.forEach(it => { if (it.cat === cat) it.cat = name; });
    m.close(); await save(); render(); toast(t('menuPage.catUpdated'), 'ok');
  };
  m.back.querySelector('[data-del]').onclick = async () => {
    m.close();
    if (!await H.confirm({ title: t('menuPage.deleteCatTitle', { cat }), text: t('menuPage.deleteCatText'), ok: t('common.delete'), danger: true })) return;
    MENU.cats = MENU.cats.filter(c => c !== cat);
    await save(); render(); toast(t('menuPage.catDeleted'), 'ok');
  };
  setTimeout(() => m.back.querySelector('#catName').select(), 30);
});

/* ---------------- edit rows */
$('q').addEventListener('input', e => { q = e.target.value; render(); });
$('list').addEventListener('input', e => {
  const inp = e.target.closest('[data-f]'); if (!inp || inp.tagName === 'SELECT') return;
  const it = MENU.items.find(x => x.id === inp.closest('.rowi').dataset.id); if (!it) return;
  if (inp.dataset.f === 'name') { it.name = inp.value; inp.classList.toggle('bad', !inp.value.trim()); }
  else if (inp.dataset.f === 'price') { if (inp.value === '') { inp.classList.add('bad'); return; } inp.classList.remove('bad'); it.price = money(inp.value); }
  scheduleSave();
});
$('list').addEventListener('focusout', e => {
  const inp = e.target.closest('[data-f]'); if (!inp) return;
  const it = MENU.items.find(x => x.id === inp.closest('.rowi').dataset.id); if (!it) return;
  if (inp.dataset.f === 'name' && !inp.value.trim()) { inp.value = it.name = it.name.trim() || 'Item'; inp.classList.remove('bad'); scheduleSave(); }
  if (inp.dataset.f === 'price') { if (inp.value === '') inp.value = it.price.toFixed(2); else { it.price = money(inp.value); inp.value = it.price.toFixed(2); } inp.classList.remove('bad'); }
});
$('list').addEventListener('change', async e => {
  const sel = e.target.closest('select[data-f="cat"]'); if (!sel) return;
  const it = MENU.items.find(x => x.id === sel.closest('.rowi').dataset.id); if (!it) return;
  let cat = sel.value;
  if (cat === '__new') { cat = await newCategory(); if (!cat) { renderCatSelect(sel, it.cat); return; } }
  it.cat = cat; await save(); render(); toast(t('menuPage.itemMoved', { name: it.name, cat }), 'ok');
});
$('list').addEventListener('click', async e => {
  const imgBtn = e.target.closest('[data-img]');
  if (imgBtn) { const row = imgBtn.closest('.rowi'); const it = MENU.items.find(x => x.id === row.dataset.id); if (it) editItemImage(it); return; }
  const b = e.target.closest('button'); if (!b) return;
  const row = b.closest('.rowi'); if (!row) return;
  const idx = MENU.items.findIndex(x => x.id === row.dataset.id); if (idx < 0) return;
  const it = MENU.items[idx];
  if (b.hasAttribute('data-del')) {
    if (!await H.confirm({ title: t('menuPage.deleteItemTitle', { name: it.name }), text: t('menuPage.deleteItemText'), ok: t('common.delete'), danger: true })) return;
    MENU.items.splice(idx, 1); await save(); render(); toast(t('menuPage.itemDeleted', { name: it.name }), 'ok'); return;
  }
  const dir = b.hasAttribute('data-up') ? -1 : b.hasAttribute('data-down') ? 1 : 0; if (!dir) return;
  let j = idx + dir; while (j >= 0 && j < MENU.items.length && MENU.items[j].cat !== it.cat) j += dir;
  if (j < 0 || j >= MENU.items.length) return;
  [MENU.items[idx], MENU.items[j]] = [MENU.items[j], MENU.items[idx]];
  await save(); render();
});

KantinDB.ready().then(() => {
  KantinDB.watchMenu(m => {
    if (m.updatedAt && m.updatedAt === lastSavedAt) return;   // echo of our own save
    if (dirty) return;                                          // don't clobber typing
    MENU = m; render();
  });
});
</script>
</body>
</html>
