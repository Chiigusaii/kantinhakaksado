<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Urus Menu — Kantin Dapo Hakaksado</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="app.css" />
<style>
  .addbar{display:grid;grid-template-columns:minmax(0,2fr) 140px minmax(0,1.4fr) auto;gap:10px;align-items:end}
  .price{position:relative}
  .price .input{padding-left:40px}
  .price span{position:absolute;left:12px;bottom:12px;font-size:.78rem;color:var(--muted);font-weight:800}
  .cats{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .cats .chip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;background:var(--c)}
  .cats .chip small{color:var(--muted);margin-left:6px}
  .listbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:22px 0 4px}
  .listbar .input{width:min(320px,100%)}
  .save-state{font-size:.78rem;color:var(--muted);font-weight:700}
  .group{margin-top:18px}
  .group h3{font-size:.86rem;font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .group h3 i{width:9px;height:9px;border-radius:50%;background:var(--c)}
  .group h3 small{color:var(--muted);font-weight:700}
  .rowi{display:grid;grid-template-columns:minmax(0,2fr) 130px minmax(0,1.3fr) auto;grid-template-areas:"n p c a";gap:8px;align-items:center;padding:6px 0}
  .rowi+.rowi{border-top:1px solid var(--line)}
  .rowi .input{padding:8px 10px;font-size:.88rem}
  .rowi .n{grid-area:n}.rowi .p{grid-area:p}.rowi .c{grid-area:c}.rowi .a{grid-area:a}
  .rowi .p .input{padding-left:38px}
  .rowi .p span{bottom:10px}
  .rowi .input.bad{border-color:var(--red)}
  .acts{display:flex;gap:4px;justify-content:flex-end}
  .acts button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff;cursor:pointer;display:grid;place-items:center;font-weight:800;font-size:.9rem}
  .acts button:hover{background:rgba(255,255,255,.14)}
  .acts button:disabled{opacity:.25;cursor:default;background:rgba(255,255,255,.06)}
  .acts .del{color:#ffb3af;border-color:rgba(240,98,92,.3);background:rgba(240,98,92,.1)}
  .acts .del:hover{background:rgba(240,98,92,.22)}
  @media (max-width:820px){
    .addbar{grid-template-columns:1fr 1fr}
    .addbar .btn{grid-column:1/-1}
    .rowi{grid-template-columns:minmax(0,1fr) 120px;grid-template-areas:"n p" "c a"}
  }
</style>
</head>
<body>
<aside class="rail" aria-label="Navigasi">
  <nav>
    <a class="nav" href="index.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>Utama</a>
    <a class="nav" href="foodmenu.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>Kaunter</a>
    <a class="nav" href="salesdata.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>Laporan</a>
    <a class="nav active" aria-current="page" href="menu.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><circle cx="7" cy="7" r="1"/></svg>Menu</a>
    <a class="nav" href="settings.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>Tetapan</a>
  </nav>
</aside>

<main>
  <div class="head">
    <div>
      <div class="brand" id="brand">Kantin Dapo Hakaksado</div>
      <h1><b>Urus</b> Menu &amp; Harga</h1>
    </div>
    <div class="head-right">
      <a id="syncBadge" class="sync" href="settings.html"><i></i>Memuatkan…</a>
      <div class="clock"><span id="today">—</span><b id="now">--:--:--</b></div>
    </div>
  </div>

  <section class="panel">
    <h2>Tambah item baru</h2>
    <form class="addbar" id="addForm">
      <label class="field">Nama makanan / minuman<input class="input" id="newName" type="text" placeholder="cth. Nasi Goreng Kampung" maxlength="60" required></label>
      <label class="field price">Harga<input class="input" id="newPrice" type="number" step="0.01" min="0" inputmode="decimal" placeholder="0.00" required><span>RM</span></label>
      <label class="field">Kategori<select class="input" id="newCat"></select></label>
      <button class="btn primary" type="submit">Tambah item</button>
    </form>
  </section>

  <section class="panel" style="margin-top:16px">
    <h2>Kategori <small>klik untuk tukar nama atau padam</small></h2>
    <div class="cats" id="cats"></div>
  </section>

  <div class="listbar">
    <input class="input" id="q" type="search" placeholder="Cari item…" autocomplete="off">
    <span class="save-state" id="saveState"></span>
  </div>
  <div id="list"></div>
</main>

<script src="config.js"></script>
<script src="menu-default.js"></script>
<script src="db.js"></script>
<script>
const H = KantinDB.h, { rm, money, esc, startClock, toast } = H;
startClock('today', 'now');
document.getElementById('brand').textContent = KantinDB.state.shopName;
const $ = id => document.getElementById(id);
let MENU = { cats: [], items: [], updatedAt: 0 }, dirty = false, lastSavedAt = 0, timer = null, q = '';
const catColor = c => { const i = MENU.cats.indexOf(c); return KantinDB.catStyle(c, i < 0 ? 0 : i).c2; };
const count = c => MENU.items.filter(it => it.cat === c).length;

/* ---------------- saving */
async function save() {
  clearTimeout(timer); dirty = false;
  $('saveState').textContent = 'Menyimpan…';
  try {
    const m = await KantinDB.saveMenu(MENU);
    lastSavedAt = m.updatedAt; MENU.updatedAt = m.updatedAt;
    $('saveState').textContent = 'Disimpan ✓';
  } catch (e) { $('saveState').textContent = 'Gagal simpan'; toast('Gagal menyimpan menu', 'err'); }
}
function scheduleSave() {
  if (MENU.items.some(it => !it.name.trim())) { $('saveState').textContent = 'Nama tidak boleh kosong'; return; }
  dirty = true; $('saveState').textContent = 'Perubahan belum disimpan…';
  clearTimeout(timer); timer = setTimeout(save, 700);
}
window.addEventListener('beforeunload', e => { if (dirty) { save(); } });

/* ---------------- rendering */
function renderCatSelect(sel, value) {
  sel.innerHTML = MENU.cats.map(c => `<option value="${esc(c)}"${c === value ? ' selected' : ''}>${esc(c)}</option>`).join('') + '<option value="__new">＋ Kategori baru…</option>';
}
function render() {
  const prevCat = $('newCat').value;
  renderCatSelect($('newCat'), MENU.cats.includes(prevCat) ? prevCat : MENU.cats[0]);
  $('cats').innerHTML = MENU.cats.map(c => `<button class="chip" type="button" data-cat="${esc(c)}" style="--c:${catColor(c)}"><i></i>${esc(c)}<small>${count(c)}</small></button>`).join('') + `<button class="chip" type="button" id="addCat">＋ Tambah kategori</button>`;
  const needle = q.trim().toLowerCase();
  let html = '';
  MENU.cats.forEach(c => {
    const items = MENU.items.filter(it => it.cat === c && (!needle || it.name.toLowerCase().includes(needle)));
    if (!items.length && needle) return;
    html += `<section class="group panel"><h3 style="--c:${catColor(c)}"><i></i>${esc(c)}<small>${items.length} item</small></h3>` +
      (items.length ? items.map(it => {
        const same = MENU.items.filter(x => x.cat === c), pos = same.indexOf(it);
        return `<div class="rowi" data-id="${esc(it.id)}">
          <div class="n"><input class="input" data-f="name" type="text" value="${esc(it.name)}" maxlength="60" aria-label="Nama"></div>
          <div class="p price"><input class="input" data-f="price" type="number" step="0.01" min="0" inputmode="decimal" value="${it.price.toFixed(2)}" aria-label="Harga"><span>RM</span></div>
          <div class="c"><select class="input" data-f="cat" aria-label="Kategori"></select></div>
          <div class="a acts"><button type="button" data-up title="Naik" ${pos === 0 ? 'disabled' : ''}>▲</button><button type="button" data-down title="Turun" ${pos === same.length - 1 ? 'disabled' : ''}>▼</button><button type="button" class="del" data-del title="Padam">×</button></div>
        </div>`;
      }).join('') : `<div class="empty">Tiada item dalam kategori ini.</div>`) + '</section>';
  });
  $('list').innerHTML = html || `<div class="empty"><b>Tiada item</b>Tambah kategori dan item di atas.</div>`;
  $('list').querySelectorAll('.rowi').forEach(row => { const it = MENU.items.find(x => x.id === row.dataset.id); renderCatSelect(row.querySelector('select'), it.cat); });
}

/* ---------------- add item */
$('newCat').addEventListener('change', async e => {
  if (e.target.value !== '__new') return;
  const name = await newCategory();
  renderCatSelect(e.target, name || MENU.cats[0]);
});
async function newCategory() {
  const v = await H.prompt({ title: 'Kategori baru', label: 'Nama kategori', placeholder: 'cth. Kuih-Muih', ok: 'Tambah' });
  if (v == null) return null;
  const name = v.trim(); if (!name) return null;
  const exists = MENU.cats.find(c => c.toLowerCase() === name.toLowerCase());
  if (exists) { toast('Kategori ini sudah ada'); return exists; }
  MENU.cats.push(name); await save(); render(); toast('Kategori ditambah', 'ok');
  return name;
}
$('addForm').addEventListener('submit', async e => {
  e.preventDefault();
  const name = $('newName').value.trim(), price = money($('newPrice').value), cat = $('newCat').value;
  if (!name) { toast('Masukkan nama item', 'err'); return; }
  if (!(price >= 0) || $('newPrice').value === '') { toast('Masukkan harga', 'err'); return; }
  if (!cat || cat === '__new') { toast('Pilih kategori', 'err'); return; }
  if (MENU.items.some(it => it.cat === cat && it.name.toLowerCase() === name.toLowerCase())) { toast(`"${name}" sudah ada dalam ${cat}`, 'err'); return; }
  MENU.items.push({ id: H.uid('m'), name, price, cat });
  await save(); render();
  $('newName').value = ''; $('newPrice').value = ''; $('newName').focus();
  toast(`${name} ditambah`, 'ok');
});

/* ---------------- categories */
$('cats').addEventListener('click', async e => {
  if (e.target.closest('#addCat')) { await newCategory(); return; }
  const b = e.target.closest('[data-cat]'); if (!b) return;
  const cat = b.dataset.cat, n = count(cat);
  const m = H.modal(`<h3>${esc(cat)}</h3><p>${n} item dalam kategori ini.</p>
    <form style="margin-top:14px"><label class="field">Nama kategori<input class="input" id="catName" type="text" value="${esc(cat)}" maxlength="40"></label>
    <div class="actions"><button type="button" class="btn danger" data-del ${n ? 'disabled title="Pindahkan atau padam semua item dahulu"' : ''}>Padam kategori</button><button type="button" class="btn" data-x>Batal</button><button type="submit" class="btn primary">Simpan nama</button></div></form>
    ${n ? '<p style="margin-top:10px;font-size:.76rem">Untuk memadam kategori, pindahkan atau padam semua itemnya dahulu.</p>' : ''}`);
  m.back.querySelector('[data-x]').onclick = m.close;
  m.back.querySelector('form').onsubmit = async ev => {
    ev.preventDefault();
    const name = m.back.querySelector('#catName').value.trim();
    if (!name) return;
    if (name !== cat && MENU.cats.some(c => c.toLowerCase() === name.toLowerCase())) { toast('Nama kategori sudah digunakan', 'err'); return; }
    MENU.cats = MENU.cats.map(c => c === cat ? name : c);
    MENU.items.forEach(it => { if (it.cat === cat) it.cat = name; });
    m.close(); await save(); render(); toast('Kategori dikemas kini', 'ok');
  };
  m.back.querySelector('[data-del]').onclick = async () => {
    m.close();
    if (!await H.confirm({ title: `Padam kategori "${cat}"?`, text: 'Kategori kosong ini akan dibuang dari menu.', ok: 'Padam', danger: true })) return;
    MENU.cats = MENU.cats.filter(c => c !== cat);
    await save(); render(); toast('Kategori dipadam', 'ok');
  };
  setTimeout(() => m.back.querySelector('#catName').select(), 30);
});

/* ---------------- edit rows */
$('q').addEventListener('input', e => { q = e.target.value; render(); });
$('list').addEventListener('input', e => {
  const inp = e.target.closest('[data-f]'); if (!inp || inp.tagName === 'SELECT') return;
  const it = MENU.items.find(x => x.id === inp.closest('.rowi').dataset.id); if (!it) return;
  if (inp.dataset.f === 'name') { it.name = inp.value; inp.classList.toggle('bad', !inp.value.trim()); }
  else if (inp.dataset.f === 'price') { if (inp.value === '') { inp.classList.add('bad'); return; } inp.classList.remove('bad'); it.price = money(inp.value); }
  scheduleSave();
});
$('list').addEventListener('focusout', e => {
  const inp = e.target.closest('[data-f]'); if (!inp) return;
  const it = MENU.items.find(x => x.id === inp.closest('.rowi').dataset.id); if (!it) return;
  if (inp.dataset.f === 'name' && !inp.value.trim()) { inp.value = it.name = it.name.trim() || 'Item'; inp.classList.remove('bad'); scheduleSave(); }
  if (inp.dataset.f === 'price') { if (inp.value === '') inp.value = it.price.toFixed(2); else { it.price = money(inp.value); inp.value = it.price.toFixed(2); } inp.classList.remove('bad'); }
});
$('list').addEventListener('change', async e => {
  const sel = e.target.closest('select[data-f="cat"]'); if (!sel) return;
  const it = MENU.items.find(x => x.id === sel.closest('.rowi').dataset.id); if (!it) return;
  let cat = sel.value;
  if (cat === '__new') { cat = await newCategory(); if (!cat) { renderCatSelect(sel, it.cat); return; } }
  it.cat = cat; await save(); render(); toast(`${it.name} dipindah ke ${cat}`, 'ok');
});
$('list').addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  const row = b.closest('.rowi'); if (!row) return;
  const idx = MENU.items.findIndex(x => x.id === row.dataset.id); if (idx < 0) return;
  const it = MENU.items[idx];
  if (b.hasAttribute('data-del')) {
    if (!await H.confirm({ title: `Padam "${it.name}"?`, text: 'Item ini akan dibuang dari menu. Rekod jualan lama tidak terjejas.', ok: 'Padam', danger: true })) return;
    MENU.items.splice(idx, 1); await save(); render(); toast(`${it.name} dipadam`, 'ok'); return;
  }
  const dir = b.hasAttribute('data-up') ? -1 : b.hasAttribute('data-down') ? 1 : 0; if (!dir) return;
  let j = idx + dir; while (j >= 0 && j < MENU.items.length && MENU.items[j].cat !== it.cat) j += dir;
  if (j < 0 || j >= MENU.items.length) return;
  [MENU.items[idx], MENU.items[j]] = [MENU.items[j], MENU.items[idx]];
  await save(); render();
});

KantinDB.ready().then(() => {
  KantinDB.watchMenu(m => {
    if (m.updatedAt && m.updatedAt === lastSavedAt) return;   // echo of our own save
    if (dirty) return;                                          // don't clobber typing
    MENU = m; render();
  });
});
</script>
</body>
</html>
