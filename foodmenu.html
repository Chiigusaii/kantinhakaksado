<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kaunter Bayaran — Kantin Dapo Hakaksado</title>
<style>
  :root{
    --maroon:#7B1E3B; --maroon-dark:#5C1329; --orange:#E07B29;
    --cream:#FDF6F0; --blush:#FBEAEA; --ink:#2B1B20; --muted:#8a7078;
    --ok:#1f9d55; --danger:#c0392b; --line:#f0dcdc;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;background:var(--cream);color:var(--ink)}
  button{font-family:inherit;cursor:pointer;border:none}
  /* ---------- top bar ---------- */
  .topbar{
    background:linear-gradient(120deg,var(--maroon-dark),var(--maroon) 50%,#96264a);
    background-size:200% 200%;animation:shift 14s ease infinite;
    color:#fff;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    position:sticky;top:0;z-index:50;box-shadow:0 4px 18px rgba(92,19,41,.25)
  }
  @keyframes shift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
  .topbar h1{font-size:1.15rem;letter-spacing:1px}
  .home{color:#FFD79B;text-decoration:none;font-weight:700;font-size:.9rem;padding:8px 14px;border:1px solid rgba(255,255,255,.35);border-radius:999px;transition:.25s}
  .home:hover{background:rgba(255,255,255,.15);transform:translateX(-3px)}
  .spacer{flex:1}
  .clock{background:rgba(0,0,0,.25);padding:8px 16px;border-radius:999px;font-variant-numeric:tabular-nums;font-weight:700}

  /* ---------- layout ---------- */
  .app{display:grid;grid-template-columns:1fr 380px;gap:18px;padding:18px;align-items:start;max-width:1500px;margin:0 auto}
  @media(max-width:980px){.app{grid-template-columns:1fr}}

  .panel{background:#fff;border-radius:18px;box-shadow:0 6px 20px rgba(92,19,41,.08);overflow:hidden}
  .panel-head{background:var(--maroon);color:#fff;padding:12px 18px;font-weight:800;letter-spacing:.5px;display:flex;align-items:center;gap:10px}

  /* ---------- search + tabs ---------- */
  .tools{padding:14px 16px;display:flex;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
  #search{
    flex:1;min-width:200px;padding:12px 16px;border:2px solid var(--line);border-radius:12px;font-size:1rem;transition:.25s
  }
  #search:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 4px rgba(224,123,41,.15)}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px}
  .tab{
    padding:9px 16px;border-radius:999px;background:var(--blush);color:var(--maroon);font-weight:700;font-size:.86rem;
    transition:transform .2s,background .2s,color .2s
  }
  .tab:hover{transform:translateY(-2px)}
  .tab.active{background:linear-gradient(135deg,var(--maroon),#a5335a);color:#fff;box-shadow:0 6px 14px rgba(123,30,59,.3)}

  /* ---------- item grid ---------- */
  .cat-title{padding:14px 16px 4px;color:var(--maroon);font-weight:800;font-size:.95rem;letter-spacing:1px;text-transform:uppercase}
  .items{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:10px;padding:10px 16px 18px}
  .item{
    background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px;text-align:left;
    display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden;
    transition:transform .2s cubic-bezier(.2,.8,.2,1),border-color .2s,box-shadow .2s;
    animation:pop .3s ease both
  }
  @keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
  .item:hover{transform:translateY(-4px);border-color:var(--orange);box-shadow:0 10px 22px rgba(224,123,41,.2)}
  .item:active{transform:scale(.96)}
  .item.flash{animation:flash .45s ease}
  @keyframes flash{0%{background:#fff}35%{background:#d8f5e2;border-color:var(--ok)}100%{background:#fff}}
  .item .nm{font-weight:700;font-size:.9rem;line-height:1.3}
  .item .pr{color:var(--orange);font-weight:800;font-size:1rem;margin-top:auto}
  .variants{display:flex;gap:6px;margin-top:auto}
  .vbtn{flex:1;padding:8px 4px;border-radius:9px;font-weight:800;font-size:.78rem;color:#fff;transition:transform .15s,filter .15s}
  .vbtn.hot{background:#c0392b}.vbtn.cold{background:#2b7fc0}
  .vbtn:hover{transform:scale(1.06);filter:brightness(1.1)}
  .badge{position:absolute;top:6px;right:6px;background:var(--ok);color:#fff;font-size:.72rem;font-weight:800;padding:2px 7px;border-radius:999px;animation:pop .25s}

  /* ---------- cart ---------- */
  .cart-wrap{position:sticky;top:76px}
  #cartList{max-height:44vh;overflow-y:auto;padding:8px 12px}
  .empty{padding:34px 16px;text-align:center;color:var(--muted);font-size:.9rem}
  .empty span{display:block;font-size:2.4rem;margin-bottom:8px;animation:bob 2.4s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-8px)}}
  .row{display:flex;align-items:center;gap:8px;padding:10px 6px;border-bottom:1px dashed var(--line);animation:slidein .3s ease}
  @keyframes slidein{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
  .row .info{flex:1;min-width:0}
  .row .nm{font-weight:700;font-size:.86rem}
  .row .un{font-size:.76rem;color:var(--muted)}
  .qty{display:flex;align-items:center;gap:4px}
  .qty button{width:28px;height:28px;border-radius:8px;background:var(--blush);color:var(--maroon);font-weight:900;font-size:1rem;transition:.15s}
  .qty button:hover{background:var(--maroon);color:#fff;transform:scale(1.1)}
  .qty span{min-width:24px;text-align:center;font-weight:800}
  .row .amt{width:74px;text-align:right;font-weight:800;color:var(--maroon)}
  .del{background:none;color:var(--danger);font-size:1rem;padding:2px 4px;transition:.15s}
  .del:hover{transform:scale(1.3) rotate(8deg)}

  .totals{padding:14px 16px;border-top:2px solid var(--line);background:#fffaf6}
  .tline{display:flex;justify-content:space-between;font-size:.9rem;color:var(--muted);margin-bottom:6px}
  .grand{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px}
  .grand span{font-weight:800;color:var(--maroon)}
  .grand b{font-size:2rem;color:var(--maroon);font-variant-numeric:tabular-nums;transition:transform .2s}
  .grand b.bump{animation:bump .35s ease}
  @keyframes bump{50%{transform:scale(1.14);color:var(--orange)}}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 16px}
  .btn{padding:14px;border-radius:12px;font-weight:800;font-size:.95rem;transition:transform .18s,box-shadow .18s,filter .18s}
  .btn:hover:not(:disabled){transform:translateY(-2px)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn-pay{grid-column:1/-1;background:linear-gradient(135deg,var(--ok),#2fbd6b);color:#fff;font-size:1.1rem;box-shadow:0 8px 20px rgba(31,157,85,.3)}
  .btn-clear{background:var(--blush);color:var(--danger)}
  .btn-ghost{background:var(--blush);color:var(--maroon)}

  /* ---------- modal ---------- */
  .overlay{position:fixed;inset:0;background:rgba(43,27,32,.6);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
  .overlay.show{display:flex;animation:fade .25s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal{background:#fff;border-radius:20px;width:100%;max-width:460px;overflow:hidden;animation:zoom .3s cubic-bezier(.2,.9,.3,1.2)}
  @keyframes zoom{from{opacity:0;transform:scale(.9) translateY(20px)}to{opacity:1;transform:none}}
  .modal-head{background:var(--maroon);color:#fff;padding:16px 20px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
  .modal-head button{background:none;color:#fff;font-size:1.3rem}
  .modal-body{padding:20px}
  .due{background:var(--blush);border-radius:14px;padding:14px;text-align:center;margin-bottom:16px}
  .due small{color:var(--muted);font-weight:700;letter-spacing:1px;font-size:.75rem}
  .due div{font-size:2.1rem;font-weight:900;color:var(--maroon)}
  label{display:block;font-weight:700;font-size:.85rem;margin-bottom:6px;color:var(--maroon)}
  #cash{width:100%;padding:14px;font-size:1.6rem;font-weight:800;text-align:center;border:2px solid var(--line);border-radius:12px;font-variant-numeric:tabular-nums}
  #cash:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 4px rgba(224,123,41,.15)}
  .quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
  .quick button{padding:11px 4px;border-radius:10px;background:var(--blush);color:var(--maroon);font-weight:800;font-size:.85rem;transition:.15s}
  .quick button:hover{background:var(--orange);color:#fff;transform:translateY(-2px)}
  .change{border-radius:14px;padding:16px;text-align:center;margin-top:6px;transition:background .3s}
  .change.ok{background:#e6f9ee;border:2px solid var(--ok)}
  .change.short{background:#fdeaea;border:2px solid var(--danger)}
  .change small{font-weight:700;letter-spacing:1px;font-size:.75rem;color:var(--muted)}
  .change div{font-size:2.3rem;font-weight:900}
  .change.ok div{color:var(--ok);animation:bump .4s}
  .change.short div{color:var(--danger)}
  .denoms{font-size:.8rem;color:var(--muted);margin-top:8px;line-height:1.5}
  .modal-foot{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 20px 20px}
  .btn-done{background:linear-gradient(135deg,var(--ok),#2fbd6b);color:#fff}

  /* ---------- toast ---------- */
  #toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,120px);background:var(--maroon);color:#fff;padding:14px 24px;border-radius:999px;font-weight:700;z-index:200;transition:transform .35s cubic-bezier(.2,.9,.3,1.3);box-shadow:0 10px 30px rgba(0,0,0,.3)}
  #toast.show{transform:translate(-50%,0)}

  /* ---------- receipt (print) ---------- */
  #receipt{display:none}
  @media print{
    body *{visibility:hidden}
    #receipt,#receipt *{visibility:visible}
    #receipt{display:block;position:absolute;left:0;top:0;width:100%;padding:10px;font-family:"Courier New",monospace;font-size:12px}
    #receipt table{width:100%;border-collapse:collapse}
    #receipt td{padding:2px 0}
    #receipt .r{text-align:right}
    #receipt hr{border:none;border-top:1px dashed #000;margin:6px 0}
    #receipt h2{text-align:center;font-size:14px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="topbar">
  <a class="home" href="kantinhakaksado.html">← Utama</a>
  <h1>KAUNTER BAYARAN</h1>
  <div class="spacer"></div>
  <a class="home" href="salesdata.html">Data Jualan 📊</a>
  <div class="clock" id="clock">--:--:--</div>
</div>

<div class="app">
  <!-- MENU -->
  <div class="panel" id="senarai">
    <div class="panel-head">🍽️ SENARAI MENU — klik untuk tambah</div>
    <div class="tools">
      <input id="search" type="search" placeholder="Cari makanan… (contoh: nasi, teh, ayam)" autocomplete="off" aria-label="Cari menu" />
      <button class="btn btn-ghost" style="padding:12px 18px" id="clearSearch">Reset</button>
    </div>
    <div class="tabs" id="tabs" role="tablist"></div>
    <div id="menuArea"></div>
  </div>

  <!-- CART -->
  <div class="cart-wrap">
    <div class="panel">
      <div class="panel-head">🧾 PESANAN PELANGGAN <span id="cartCount" style="margin-left:auto;font-size:.85rem"></span></div>
      <div id="cartList"><div class="empty"><span>🛒</span>Belum ada pesanan.<br />Klik menu di sebelah untuk mula.</div></div>
      <div class="totals">
        <div class="tline"><span>Bilangan item</span><span id="itemCount">0</span></div>
        <div class="grand"><span>JUMLAH</span><b id="grand">RM0.00</b></div>
      </div>
      <div class="actions">
        <button class="btn btn-pay" id="btnPay" disabled>💵 BAYAR (F2)</button>
        <button class="btn btn-clear" id="btnClear" disabled>Kosongkan</button>
        <button class="btn btn-ghost" id="btnLast">Resit Terakhir</button>
      </div>
    </div>
  </div>
</div>

<!-- PAYMENT MODAL -->
<div class="overlay" id="payModal" role="dialog" aria-modal="true" aria-labelledby="payTitle">
  <div class="modal">
    <div class="modal-head"><span id="payTitle">💵 BAYARAN TUNAI</span><button id="closePay" aria-label="Tutup">✕</button></div>
    <div class="modal-body">
      <div class="due"><small>JUMLAH PERLU DIBAYAR</small><div id="dueAmt">RM0.00</div></div>
      <label for="cash">Duit diterima daripada pelanggan (RM)</label>
      <input id="cash" type="number" step="0.05" min="0" inputmode="decimal" placeholder="0.00" />
      <div class="quick" id="quickCash"></div>
      <div class="change short" id="changeBox"><small>BAKI UNTUK PELANGGAN</small><div id="changeAmt">RM0.00</div><div class="denoms" id="denoms"></div></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-clear" id="cancelPay">Batal</button>
      <button class="btn btn-done" id="confirmPay" disabled>✔ SELESAI & SIMPAN</button>
    </div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>
<div id="receipt"></div>

<script>
/* =========================================================
   MENU DATA — ikut senarai harga Kantin Dapo Hakaksado
   ========================================================= */
const MENU=[
 {cat:'Sarapan Pagi',items:[
  {n:'Roti Bakar (1 Set)',p:2.00},{n:'Roti Canai (1 Set)',p:1.50},{n:'Kuih (Sebiji)',p:0.60},
  {n:'Nasi Lemak (Bks)',p:2.00},{n:'Nasi Lemak + Telur (Spg)',p:3.00},{n:'Nasi Lemak + Ayam (Spg)',p:4.50},
  {n:'Mee Hoon Goreng (Bks)',p:2.00},{n:'Kue Teow Goreng (Bks)',p:2.00},{n:'Lontong (Spg)',p:4.50},
  {n:'Soto / Mee Soto (Spg)',p:4.50},{n:'Mee Rebus (Spg)',p:4.50},{n:'Mee Kari (Spg)',p:4.50},
  {n:'Add-on Telur (Bji)',p:1.50},{n:'Add-on Ayam (Ktl)',p:3.00}]},
 {cat:'Nasi & Telur',items:[
  {n:'Nasi Putih (Spg)',p:1.50},{n:'Nasi Minyak (Spg)',p:6.00},{n:'Nasi Briyani (Spg)',p:6.00},
  {n:'Nasi Tomato (Spg)',p:5.00},{n:'Telur Masak Sambal (Bji)',p:2.50},{n:'Telur Mata (Bji)',p:1.00},
  {n:'Telur Dadar (Bji)',p:1.50},{n:'Telur Masin (Bji)',p:2.00},{n:'Telur Masin (1/2 Bji)',p:1.50}]},
 {cat:'Lauk (Ikan & Ayam)',items:[
  {n:'Kembong (Ktl)',p:3.00},{n:'Selar (Ktl)',p:3.00},{n:'Selayang (Ktl)',p:3.00},{n:'Cencaru (Ktl)',p:3.00},
  {n:'Keli (Ktl)',p:3.00},{n:'Bawal (Ktl)',p:4.00},{n:'Merah (Ktl)',p:5.00},{n:'Siakap (Ktl)',p:5.00},
  {n:'Mayong (Ktl)',p:5.00},{n:'Ayam Goreng (Ktl)',p:3.00},{n:'Ayam Masak Berlauk (Ktl)',p:4.00}]},
 {cat:'Sayur-Sayuran',items:[
  {n:'Kangkung',p:2.00},{n:'Bayam',p:2.00},{n:'Sawi',p:2.00},{n:'Taugeh',p:2.00},{n:'Kobis',p:2.00},
  {n:'Sayur Campur',p:2.50},{n:'Bendi',p:2.50},{n:'Kobis Bunga',p:2.50},{n:'Brokoli',p:2.50},
  {n:'Kacang Buncis',p:2.50},{n:'Peria',p:2.00},{n:'Petola',p:2.00},{n:'Sambal Jawa',p:3.00}]},
 {cat:'Minuman (Panas / Sejuk)',items:[
  {n:'Teh O',hot:1.00,cold:1.50},{n:'Teh',hot:1.50,cold:2.00},{n:'Kopi O',hot:1.00,cold:1.50},
  {n:'Kopi',hot:1.50,cold:2.00},{n:'Nescafe O',hot:1.50,cold:2.00},{n:'Nescafe',hot:2.00,cold:2.50},
  {n:'Milo O',hot:1.50,cold:2.00},{n:'Milo',hot:2.00,cold:2.50},{n:'Air 3 in 1',hot:3.00,cold:3.50}]},
 {cat:'Minuman Lain',items:[
  {n:'Cordial',p:1.00},{n:'Air Tin',p:2.00},{n:'Air Mineral (600ml)',p:1.50},{n:'Air Minuman (500ml)',p:1.20}]}
];

const KEY='hakaksado_sales_v1', LASTKEY='hakaksado_last_receipt';
const rm=n=>'RM'+Number(n||0).toFixed(2);
const $=id=>document.getElementById(id);
let cart=[], activeCat='Semua', query='';

/* ---------- clock ---------- */
setInterval(()=>{$('clock').textContent=new Date().toLocaleTimeString('en-GB')},1000);
$('clock').textContent=new Date().toLocaleTimeString('en-GB');

/* ---------- tabs ---------- */
const cats=['Semua',...MENU.map(g=>g.cat)];
$('tabs').innerHTML=cats.map(c=>`<button class="tab${c===activeCat?' active':''}" role="tab" data-cat="${c}">${c}</button>`).join('');
$('tabs').addEventListener('click',e=>{
  const b=e.target.closest('.tab'); if(!b) return;
  activeCat=b.dataset.cat;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t===b));
  renderMenu();
});

/* ---------- search ---------- */
$('search').addEventListener('input',e=>{query=e.target.value.toLowerCase().trim();renderMenu()});
$('clearSearch').addEventListener('click',()=>{query='';$('search').value='';activeCat='Semua';
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',i===0));renderMenu();$('search').focus()});

/* ---------- render menu ---------- */
function renderMenu(){
  const groups=MENU
    .filter(g=>activeCat==='Semua'||g.cat===activeCat)
    .map(g=>({cat:g.cat,items:g.items.filter(i=>i.n.toLowerCase().includes(query))}))
    .filter(g=>g.items.length);

  if(!groups.length){$('menuArea').innerHTML='<div class="empty">Tiada menu dijumpai untuk "'+query+'".</div>';return}

  $('menuArea').innerHTML=groups.map(g=>`
    <div class="cat-title">${g.cat}</div>
    <div class="items">
      ${g.items.map(i=>{
        const q=qtyOf(i.n);
        const badge=q?`<span class="badge">${q}</span>`:'';
        if(i.hot!==undefined){
          return `<div class="item" data-name="${i.n}">${badge}
            <div class="nm">${i.n}</div>
            <div class="variants">
              <button class="vbtn hot" data-add="${i.n} (Panas)" data-price="${i.hot}">🔥 ${i.hot.toFixed(2)}</button>
              <button class="vbtn cold" data-add="${i.n} (Sejuk)" data-price="${i.cold}">❄ ${i.cold.toFixed(2)}</button>
            </div></div>`;
        }
        return `<button class="item" data-add="${i.n}" data-price="${i.p}" data-name="${i.n}">${badge}
          <div class="nm">${i.n}</div><div class="pr">${rm(i.p)}</div></button>`;
      }).join('')}
    </div>`).join('');
}
function qtyOf(base){return cart.filter(l=>l.name===base||l.name.startsWith(base+' (')).reduce((s,l)=>s+l.qty,0)}

$('menuArea').addEventListener('click',e=>{
  const b=e.target.closest('[data-add]'); if(!b) return;
  add(b.dataset.add,parseFloat(b.dataset.price));
  const card=b.closest('.item'); card.classList.remove('flash'); void card.offsetWidth; card.classList.add('flash');
});

/* ---------- cart ---------- */
function add(name,price){
  const line=cart.find(l=>l.name===name);
  if(line) line.qty++; else cart.push({name,price,qty:1});
  renderCart(); renderMenu();
}
function change(i,d){
  cart[i].qty+=d;
  if(cart[i].qty<=0) cart.splice(i,1);
  renderCart(); renderMenu();
}
const total=()=>cart.reduce((s,l)=>s+l.price*l.qty,0);
const count=()=>cart.reduce((s,l)=>s+l.qty,0);

function renderCart(){
  const list=$('cartList');
  if(!cart.length){
    list.innerHTML='<div class="empty"><span>🛒</span>Belum ada pesanan.<br />Klik menu di sebelah untuk mula.</div>';
  }else{
    list.innerHTML=cart.map((l,i)=>`
      <div class="row">
        <div class="info"><div class="nm">${l.name}</div><div class="un">${rm(l.price)} × ${l.qty}</div></div>
        <div class="qty">
          <button data-i="${i}" data-d="-1" aria-label="Kurang ${l.name}">−</button>
          <span>${l.qty}</span>
          <button data-i="${i}" data-d="1" aria-label="Tambah ${l.name}">+</button>
        </div>
        <div class="amt">${rm(l.price*l.qty)}</div>
        <button class="del" data-i="${i}" data-d="-999" aria-label="Buang ${l.name}">🗑</button>
      </div>`).join('');
  }
  const g=$('grand');
  g.textContent=rm(total());
  g.classList.remove('bump'); void g.offsetWidth; g.classList.add('bump');
  $('itemCount').textContent=count();
  $('cartCount').textContent=cart.length?count()+' item':'';
  $('btnPay').disabled=!cart.length;
  $('btnClear').disabled=!cart.length;
}
$('cartList').addEventListener('click',e=>{
  const b=e.target.closest('[data-i]'); if(!b) return;
  const i=+b.dataset.i, d=+b.dataset.d;
  if(d===-999){cart.splice(i,1);renderCart();renderMenu()} else change(i,d);
});
$('btnClear').addEventListener('click',()=>{
  if(cart.length && confirm('Kosongkan semua pesanan ini?')){cart=[];renderCart();renderMenu();toast('Pesanan dikosongkan')}
});

/* ---------- payment ---------- */
const QUICK=[1,5,10,20,50,100];
$('quickCash').innerHTML=QUICK.map(v=>`<button data-c="${v}">RM${v}</button>`).join('')+'<button data-c="exact" style="grid-column:span 2;background:var(--orange);color:#fff">Duit Tepat</button>';

function openPay(){
  if(!cart.length) return;
  $('dueAmt').textContent=rm(total());
  $('cash').value=''; updateChange();
  $('payModal').classList.add('show');
  setTimeout(()=>$('cash').focus(),120);
}
function closePay(){$('payModal').classList.remove('show')}
$('btnPay').addEventListener('click',openPay);
$('closePay').addEventListener('click',closePay);
$('cancelPay').addEventListener('click',closePay);
$('payModal').addEventListener('click',e=>{if(e.target===$('payModal'))closePay()});

$('quickCash').addEventListener('click',e=>{
  const b=e.target.closest('[data-c]'); if(!b) return;
  if(b.dataset.c==='exact'){$('cash').value=total().toFixed(2)}
  else{$('cash').value=((parseFloat($('cash').value)||0)+parseFloat(b.dataset.c)).toFixed(2)}
  updateChange();
});
$('cash').addEventListener('input',updateChange);
$('cash').addEventListener('keydown',e=>{if(e.key==='Enter'&&!$('confirmPay').disabled)finish()});

function denomText(amt){
  const d=[50,20,10,5,1,0.5,0.2,0.1,0.05], out=[];
  let left=Math.round(amt*100);
  d.forEach(v=>{const c=Math.floor(left/Math.round(v*100)); if(c>0){out.push(`${c} × RM${v.toFixed(2)}`);left-=c*Math.round(v*100)}});
  return out.length?'Pecahan baki: '+out.join(' • '):'';
}
function updateChange(){
  const due=total(), cash=parseFloat($('cash').value)||0, diff=cash-due;
  const box=$('changeBox');
  if(cash>=due&&cash>0){
    box.className='change ok';
    $('changeAmt').textContent=rm(diff);
    $('changeBox').querySelector('small').textContent=diff>0?'BAKI UNTUK PELANGGAN':'DUIT TEPAT — TIADA BAKI';
    $('denoms').textContent=diff>0?denomText(diff):'';
    $('confirmPay').disabled=false;
  }else{
    box.className='change short';
    $('changeAmt').textContent=rm(Math.max(due-cash,0));
    $('changeBox').querySelector('small').textContent='DUIT TIDAK CUKUP — KURANG';
    $('denoms').textContent='';
    $('confirmPay').disabled=true;
  }
}
$('confirmPay').addEventListener('click',finish);

function finish(){
  const due=total(), cash=parseFloat($('cash').value)||0;
  if(cash<due) return;
  const now=new Date();
  const sale={
    id:'INV'+now.getFullYear()+String(now.getMonth()+1).padStart(2,'0')+String(now.getDate()).padStart(2,'0')+'-'+now.getTime().toString().slice(-6),
    ts:now.toISOString(),
    items:cart.map(l=>({name:l.name,price:l.price,qty:l.qty})),
    total:+due.toFixed(2), paid:+cash.toFixed(2), change:+(cash-due).toFixed(2), method:'Tunai'
  };
  const all=JSON.parse(localStorage.getItem(KEY)||'[]');
  all.push(sale);
  localStorage.setItem(KEY,JSON.stringify(all));
  localStorage.setItem(LASTKEY,JSON.stringify(sale));
  buildReceipt(sale);
  closePay();
  cart=[]; renderCart(); renderMenu();
  toast('✔ Jualan disimpan • Baki '+rm(sale.change));
  if(confirm('Jualan disimpan.\n\nBaki: '+rm(sale.change)+'\n\nCetak resit sekarang?')) window.print();
}

function buildReceipt(s){
  const t=new Date(s.ts);
  $('receipt').innerHTML=`
    <h2>KANTIN DAPO HAKAKSADO</h2>
    <div style="text-align:center">Resit Jualan</div><hr />
    <div>No: ${s.id}</div>
    <div>Tarikh: ${t.toLocaleDateString('en-GB')} ${t.toLocaleTimeString('en-GB')}</div><hr />
    <table>${s.items.map(i=>`<tr><td>${i.qty} × ${i.name}</td><td class="r">${(i.price*i.qty).toFixed(2)}</td></tr>`).join('')}</table>
    <hr />
    <table>
      <tr><td><b>JUMLAH</b></td><td class="r"><b>RM${s.total.toFixed(2)}</b></td></tr>
      <tr><td>Tunai</td><td class="r">RM${s.paid.toFixed(2)}</td></tr>
      <tr><td>Baki</td><td class="r">RM${s.change.toFixed(2)}</td></tr>
    </table><hr />
    <div style="text-align:center">Terima kasih! Sila datang lagi.</div>`;
}
$('btnLast').addEventListener('click',()=>{
  const last=localStorage.getItem(LASTKEY);
  if(!last){toast('Belum ada resit');return}
  buildReceipt(JSON.parse(last)); window.print();
});

/* ---------- toast + shortcuts ---------- */
let tId;
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(tId);tId=setTimeout(()=>t.classList.remove('show'),2600)}
document.addEventListener('keydown',e=>{
  if(e.key==='F2'){e.preventDefault();openPay()}
  if(e.key==='Escape')closePay();
  if(e.key==='F3'){e.preventDefault();$('search').focus();$('search').select()}
});

renderMenu(); renderCart();
</script>
</body>
</html>
