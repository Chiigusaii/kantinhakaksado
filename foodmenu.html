<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#272833" />
<title>Kaunter Bayaran — Kantin Dapo Hakaksado</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="app.css" />
<style>
  main{max-width:110rem;padding-bottom:1.5rem}
  .today-pill{
    display:inline-flex;align-items:center;gap:.5rem;background:rgba(235,90,15,.14);
    border:1px solid rgba(235,90,15,.35);border-radius:999px;padding:.6rem 1.1rem;min-height:var(--tap);
    font-size:.84rem;font-weight:800;color:#ffc59f;text-decoration:none;white-space:nowrap
  }
  .today-pill b{color:#fff;font-variant-numeric:tabular-nums}
  .pos{display:grid;grid-template-columns:minmax(0,1fr) clamp(18rem,34vw,26rem);gap:1.25rem;align-items:start}

  /* ---------- menu side ---------- */
  .tools{display:flex;gap:.75rem;align-items:center;margin-bottom:.9rem}
  .search{position:relative;flex:1;min-width:0}
  .search .input{padding-left:3.2rem;min-height:var(--tap-lg);font-size:1.1rem;border-radius:var(--r-lg)}
  .search svg{
    position:absolute;left:1.1rem;top:50%;transform:translateY(-50%);width:1.35rem;height:1.35rem;
    stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;pointer-events:none
  }
  .catbar{
    display:flex;gap:.55rem;overflow-x:auto;padding:.15rem .25rem 1rem;margin-bottom:.25rem;
    scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity
  }
  .catbar::-webkit-scrollbar{display:none}
  .catbar .chip{flex:none;scroll-snap-align:start}
  .chip i{display:inline-block;width:.6rem;height:.6rem;border-radius:50%;margin-right:.5rem;background:var(--c,#fff)}

  .items{display:grid;grid-template-columns:repeat(auto-fill,minmax(10.5rem,1fr));gap:1rem}
  .cat-title{
    grid-column:1/-1;font-size:.9rem;font-weight:800;color:var(--muted);
    margin:.9rem 0 -.15rem;display:flex;align-items:center;gap:.55rem
  }
  .cat-title i{width:.65rem;height:.65rem;border-radius:50%;background:var(--c)}
  .cat-title:first-child{margin-top:0}

  /* ---------- item tiles ---------- */
  .item{
    position:relative;text-align:left;background:rgba(255,255,255,.05);border:1px solid var(--line);
    border-radius:var(--r-lg);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;color:#fff;
    transition:transform .22s var(--ease),box-shadow .22s,background .2s,border-color .2s
  }
  .item:hover{transform:translateY(-.35rem);box-shadow:0 1rem 1.8rem rgba(0,0,0,.34);background:rgba(255,255,255,.09)}
  .item:active{transform:scale(.955)}
  .item.picked{border-color:var(--orange);background:rgba(235,90,15,.12)}
  .item .thumb{
    height:7rem;display:flex;align-items:center;justify-content:center;font-size:3.2rem;
    background:linear-gradient(160deg,var(--c1,#3a3d4b),var(--c2,#272833));
    position:relative;overflow:hidden;flex:none
  }
  .item .thumb img{width:100%;height:100%;object-fit:cover;transition:transform .35s var(--ease)}
  .item:hover .thumb img{transform:scale(1.07)}
  .item .body{padding:.7rem .8rem .85rem;display:flex;flex-direction:column;gap:.2rem;flex:1}
  .item b{font-size:.98rem;font-weight:800;line-height:1.25}
  .item .pr{font-size:1.02rem;color:#ffc59f;font-variant-numeric:tabular-nums;font-weight:800;margin-top:auto}
  .item .n{
    position:absolute;top:.5rem;right:.5rem;background:var(--orange);color:#fff;border-radius:999px;
    min-width:2rem;height:2rem;padding:0 .5rem;display:grid;place-items:center;font-size:.9rem;font-weight:800;
    box-shadow:0 .3rem .8rem rgba(0,0,0,.45);z-index:2;animation:popIn .28s var(--ease)
  }
  .item .plus{
    position:absolute;left:.5rem;top:.5rem;width:2rem;height:2rem;border-radius:50%;
    background:rgba(0,0,0,.42);backdrop-filter:blur(3px);display:grid;place-items:center;
    color:#fff;font-weight:800;font-size:1.2rem;opacity:0;transform:scale(.6);transition:opacity .18s,transform .18s
  }
  .item:hover .plus{opacity:1;transform:scale(1)}

  /* the tile ghost that flies into the order panel when something is added */
  .fly-ghost{
    position:fixed;z-index:150;pointer-events:none;border-radius:var(--r-lg);overflow:hidden;
    box-shadow:0 1.2rem 2.4rem rgba(0,0,0,.5);
    transition:transform .5s cubic-bezier(.4,0,.25,1),opacity .5s ease-in,border-radius .5s
  }
  @keyframes bump{0%,100%{transform:none}35%{transform:scale(1.06)}}
  .bump{animation:bump .38s var(--ease)}

  /* ---------- product detail ---------- */
  .detail{display:grid;grid-template-columns:15rem minmax(0,1fr);gap:1.4rem;align-items:start}
  .detail .d-thumb{
    height:13rem;border-radius:var(--r-lg);display:flex;align-items:center;justify-content:center;
    font-size:5rem;background:linear-gradient(160deg,var(--c1,#3a3d4b),var(--c2,#272833));
    overflow:hidden;position:relative
  }
  .detail .d-thumb img{width:100%;height:100%;object-fit:cover}
  .detail h3{font-size:1.5rem;margin-bottom:.15rem;line-height:1.2}
  .detail .d-price{font-size:1.5rem;font-weight:800;color:#ffc59f;margin-bottom:1.1rem;font-variant-numeric:tabular-nums}
  .detail .d-price s{color:var(--muted);font-weight:700;font-size:.95rem;margin-left:.6rem}
  .detail .d-block{margin-bottom:1.2rem}
  .detail .d-block>label{display:block;font-size:.88rem;font-weight:800;color:var(--muted);margin-bottom:.6rem}
  .qty-row{display:flex;align-items:center;gap:1rem}
  .qty-row button{
    width:var(--tap-xl);height:var(--tap-xl);border-radius:var(--r-md);border:1px solid var(--line);
    background:rgba(255,255,255,.08);color:#fff;font-size:2rem;font-weight:800;cursor:pointer;
    display:grid;place-items:center;line-height:1;position:relative;overflow:hidden;
    transition:background .15s,transform .1s
  }
  .qty-row button:hover{background:rgba(255,255,255,.16)}
  .qty-row button:active{transform:scale(.92)}
  .qty-row b{font-size:2.2rem;min-width:3.5rem;text-align:center;font-variant-numeric:tabular-nums}
  .notes{display:flex;gap:.5rem;flex-wrap:wrap}
  .notes button{
    border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff;border-radius:999px;
    padding:.6rem 1rem;min-height:2.9rem;font-size:.88rem;font-weight:800;cursor:pointer;
    position:relative;overflow:hidden;transition:background .15s,transform .12s
  }
  .notes button:hover{background:rgba(255,255,255,.13)}
  .notes button:active{transform:scale(.95)}
  .hint{font-size:.82rem;color:var(--muted);font-weight:700;line-height:1.5}
  .detail .foot{grid-column:1/-1;border-top:1px solid var(--line);padding-top:1.1rem}

  /* ---------- payment screen ---------- */
  .pay-screen{display:flex;flex-direction:column;height:100%;gap:1.1rem}
  .pay-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:1.3rem;flex:1;min-height:0}
  .pay-col{display:flex;flex-direction:column;gap:.9rem;min-height:0}
  .due{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:var(--r-lg);padding:1.1rem 1.3rem}
  .due span{display:block;color:var(--muted);font-size:.88rem;font-weight:800;margin-bottom:.15rem}
  .due b{font-size:2.4rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
  .amt-display{
    font-size:2.8rem;font-weight:800;text-align:right;background:rgba(0,0,0,.28);border:1px solid var(--line);
    border-radius:var(--r-lg);padding:.9rem 1.2rem;font-variant-numeric:tabular-nums;color:#fff;width:100%;
    min-height:var(--tap-xl)
  }
  .amt-display:focus{border-color:var(--orange-2);outline:none}
  .quick-amts{display:flex;gap:.5rem;flex-wrap:wrap}
  .quick-amts button{
    border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff;border-radius:999px;
    padding:.65rem 1.05rem;min-height:3.1rem;font-size:.92rem;font-weight:800;cursor:pointer;
    position:relative;overflow:hidden;transition:background .15s,transform .12s
  }
  .quick-amts button:hover{background:rgba(255,255,255,.14)}
  .quick-amts button:active{transform:scale(.94)}
  .quick-amts button.exact{background:rgba(62,207,142,.16);border-color:rgba(62,207,142,.34);color:#8fe9be}
  .pay-screen .keypad{flex:1;min-height:0;grid-template-rows:repeat(4,minmax(0,1fr))}
  .pay-screen .keypad button{min-height:3.4rem;height:100%}
  .change{
    display:flex;justify-content:space-between;align-items:center;gap:1rem;
    background:rgba(62,207,142,.1);border:1px solid rgba(62,207,142,.28);border-radius:var(--r-lg);
    padding:1rem 1.3rem;font-weight:800;font-size:1rem;min-height:var(--tap-lg)
  }
  .change.short{background:rgba(240,98,92,.1);border-color:rgba(240,98,92,.32);color:#ffb3af}
  .change b{font-size:2rem;font-variant-numeric:tabular-nums}
  .pay-actions{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.8rem;flex:none}

  /* ---------- receipt / success ---------- */
  .receipt{text-align:center;display:flex;flex-direction:column;height:100%;justify-content:center;gap:.4rem}
  .receipt .tick{
    width:6rem;height:6rem;border-radius:1.9rem;background:var(--green);color:#0f2b1f;
    display:grid;place-items:center;margin:0 auto .9rem;position:relative
  }
  .receipt .tick svg{width:3.2rem;height:3.2rem;stroke:#0f2b1f;stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .receipt .tick svg path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .45s var(--ease) forwards .22s}
  @keyframes draw{to{stroke-dashoffset:0}}
  .receipt .tick::after{
    content:"";position:absolute;inset:-.5rem;border-radius:2.4rem;border:2px solid var(--green);
    opacity:0;animation:ring 1.1s var(--ease) .3s
  }
  @keyframes ring{0%{opacity:.7;transform:scale(.9)}100%{opacity:0;transform:scale(1.35)}}
  .receipt h3{font-size:2rem;color:var(--green);margin-bottom:1.2rem}
  .receipt .rows{
    width:min(30rem,100%);margin:0 auto;text-align:left;background:rgba(255,255,255,.05);
    border:1px solid var(--line);border-radius:var(--r-lg);padding:1.1rem 1.3rem
  }
  .receipt .rows div{display:flex;justify-content:space-between;gap:1rem;padding:.4rem 0;color:var(--muted);font-size:1rem;font-weight:700}
  .receipt .rows div b{color:#fff;font-variant-numeric:tabular-nums;font-size:1.15rem}
  .receipt .rows div.grand{border-top:1px dashed var(--line-2);margin-top:.4rem;padding-top:.7rem}
  .receipt .rows div.grand b{font-size:1.9rem;color:var(--green)}
  .receipt .lines-mini{width:min(30rem,100%);margin:.8rem auto 0;text-align:left;font-size:.9rem;max-height:9rem;overflow:auto}
  .receipt .lines-mini div{display:flex;justify-content:space-between;gap:1rem;padding:.25rem 0;color:var(--muted);font-weight:700}
  .receipt .lines-mini div b{color:#fff;font-variant-numeric:tabular-nums}
  .receipt .actions{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;width:min(30rem,100%);margin:1.4rem auto 0}

  /* ---------- order panel (cart) ---------- */
  .cart{
    position:sticky;top:1.25rem;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-xl);
    display:flex;flex-direction:column;max-height:calc(100vh - 2.5rem);max-height:calc(100dvh - 2.5rem);
    box-shadow:0 1rem 2rem rgba(0,0,0,.3);overflow:hidden
  }
  .sheet-bar{display:none}
  .cart-head{display:flex;justify-content:space-between;align-items:center;gap:.6rem;padding:1.1rem 1.2rem .6rem;flex:none}
  .cart-head h2{font-size:1.15rem;font-weight:800}
  .cart-head h2 small{color:var(--muted);font-weight:700;font-size:.85rem;margin-left:.4rem}
  .lines{flex:1 1 auto;overflow:auto;padding:0 .7rem;min-height:6rem;overscroll-behavior:contain}
  .line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.35rem .7rem;padding:.8rem .6rem;align-items:center}
  .line+.line{border-top:1px solid var(--line)}
  .line.is-new{animation:lineIn .34s var(--ease) backwards}
  @keyframes lineIn{from{opacity:0;transform:translateX(1.2rem)}}
  .line .nm{font-weight:800;font-size:1rem;line-height:1.25;overflow-wrap:anywhere}
  .line .pr{
    font-size:.86rem;color:var(--muted);font-weight:700;cursor:pointer;display:inline-flex;gap:.4rem;
    align-items:center;background:none;border:0;padding:.2rem 0;border-bottom:1px dashed rgba(255,255,255,.32);
    justify-self:start;min-height:2rem
  }
  .line .pr:hover{color:#fff}
  .line .amt{font-weight:800;font-variant-numeric:tabular-nums;text-align:right;font-size:1.1rem}
  .qty{display:inline-flex;align-items:center;gap:.3rem;justify-self:end}
  .qty button{
    width:2.9rem;height:2.9rem;border-radius:var(--r-sm);border:1px solid var(--line);
    background:rgba(255,255,255,.08);color:#fff;font-weight:800;cursor:pointer;font-size:1.35rem;
    display:grid;place-items:center;line-height:1;transition:background .15s,transform .1s
  }
  .qty button:hover{background:rgba(255,255,255,.16)}
  .qty button:active{transform:scale(.9)}
  .qty b{min-width:2.2rem;text-align:center;font-variant-numeric:tabular-nums;font-size:1.15rem}
  .qty .rmv{color:#ffb3af;margin-left:.3rem;border-color:rgba(240,98,92,.3);background:rgba(240,98,92,.12);font-size:1.1rem}
  .cart .empty{padding:2.4rem 1rem}
  .cart .empty .art{font-size:3.4rem;display:block;margin-bottom:.6rem;animation:float 4s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-.5rem)}}

  .totals{padding:.8rem 1.2rem 0;border-top:1px solid var(--line);flex:none}
  .trow{display:flex;justify-content:space-between;align-items:center;font-size:.92rem;color:var(--muted);font-weight:700;padding:.25rem 0;gap:.6rem}
  .trow.big{font-size:1.05rem;color:#fff;padding-top:.5rem;align-items:baseline}
  .trow.big b{font-size:2.3rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1;display:inline-block}
  .trow .adj{color:#8fe9be}
  .linkbtn{
    background:none;border:0;color:var(--orange-2);font-weight:800;font-size:.88rem;cursor:pointer;
    padding:.4rem 0;text-decoration:underline;text-underline-offset:4px;min-height:2.4rem
  }
  .pay{padding:.7rem 1.2rem 1.2rem;display:flex;flex-direction:column;gap:.6rem;flex:none}
  #openPayBtn{font-size:1.35rem;letter-spacing:.01em}

  /* ---------- portrait / small screens: order panel becomes a bottom sheet ---------- */
  @media (max-width:1080px){
    .pos{grid-template-columns:1fr}
    main{padding-bottom:8rem}
    .cart{
      position:fixed;left:calc(var(--rail-w) + var(--safe-l));right:0;bottom:0;top:auto;
      max-height:none;border-radius:var(--r-xl) var(--r-xl) 0 0;
      transform:translateY(calc(100% - 5.5rem - var(--safe-b)));
      transition:transform .34s var(--ease);z-index:55;
      box-shadow:0 -.6rem 2rem rgba(0,0,0,.45);height:86vh;height:86dvh
    }
    .cart.open{transform:translateY(0)}
    .cart.open .sheet-bar{display:none}
    .sheet-bar{
      display:flex;height:5.5rem;padding:0 1.2rem;align-items:center;justify-content:space-between;
      gap:.8rem;cursor:pointer;flex:none
    }
    .sheet-bar .sum{font-weight:800;font-size:1.5rem;font-variant-numeric:tabular-nums}
    .sheet-bar .sum small{display:block;color:var(--muted);font-size:.85rem;font-weight:700}
    .sheet-bar .btn{min-height:var(--tap-lg);font-size:1.1rem;padding-left:1.6rem;padding-right:1.6rem}
    .cart-head .close{display:inline-flex}
    .pay{padding-bottom:calc(1.2rem + var(--safe-b))}
    .detail{grid-template-columns:1fr}
    .detail .d-thumb{height:11rem}
  }
  @media (min-width:1081px){ .cart-head .close{display:none} }
  @media (max-width:820px){
    .pay-grid{grid-template-columns:1fr;overflow:auto}
    .pay-screen .keypad button{min-height:var(--tap-lg)}
    .amt-display{font-size:2.2rem}
  }
  @media (max-width:760px){
    .cart{left:0;bottom:calc(4.75rem + var(--safe-b));height:calc(86vh - 4.75rem);height:calc(86dvh - 4.75rem)}
    main{padding-bottom:11rem}
    .items{grid-template-columns:repeat(auto-fill,minmax(8.5rem,1fr))}
    .receipt .actions{grid-template-columns:1fr}
  }
</style>
</head>

<main>
  <div class="head">
    <div>
      <div class="brand" id="brand">Kantin Dapo Hakaksado</div>
      <h1 data-i18n-html="counter.title"><b>Kaunter</b> Bayaran</h1>
    </div>
    <div class="head-right">
      <a class="today-pill" id="todayPill" href="salesdata.html?p=day">Hari ini <b>RM0.00</b> · 0 transaksi</a>
      <a id="syncBadge" class="sync" href="settings.html"><i></i>Memuatkan…</a>
      <div class="clock"><span id="today">—</span><b id="now">--:--:--</b></div>
    </div>
  </div>

  <div class="pos">
    <section class="menu-area" aria-label="Pilih makanan">
      <div class="tools">
        <label class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input class="input" id="q" type="search" data-i18n-placeholder="counter.searchPlaceholder" placeholder="Cari makanan atau minuman…" autocomplete="off">
        </label>
        <a class="btn" href="menu.html" data-i18n="counter.manageMenu">Urus menu</a>
      </div>
      <div class="chips catbar" id="chips" role="tablist"></div>
      <div class="items" id="items"></div>
    </section>

    <aside class="cart" id="cart" aria-label="Pesanan">
      <div class="sheet-bar" id="sheetBar">
        <div class="sum"><span id="sbTotal">RM0.00</span><small id="sbCount">Tiada item</small></div>
        <button class="btn primary" id="sbToggle" type="button" data-i18n="counter.viewOrder">Lihat pesanan</button>
      </div>
      <div class="cart-head">
        <h2><span data-i18n="counter.cartTitle">Pesanan</span> <small id="cartCount"></small></h2>
        <div class="row" style="gap:.4rem">
          <button class="btn sm ghost" id="clearBtn" type="button" data-i18n="counter.clear">Kosongkan</button>
          <button class="btn sm close" id="closeSheet" type="button" aria-label="Tutup">▾</button>
        </div>
      </div>
      <div class="lines" id="lines"></div>
      <div class="totals">
        <div class="trow"><span data-i18n="counter.subtotal">Subtotal</span><span id="tSub">RM0.00</span></div>
        <div class="trow" id="tAdjRow" hidden><span data-i18n="counter.adjustment">Pelarasan</span> <span class="muted" id="tNote"></span><span class="adj" id="tAdj"></span></div>
        <div class="trow"><span></span><button class="linkbtn" id="adjBtn" type="button">Ubah jumlah</button></div>
        <div class="trow big"><span data-i18n="counter.total">Jumlah</span><b id="tTotal">RM0.00</b></div>
      </div>
      <div class="pay">
        <button class="btn primary xl block" id="openPayBtn" type="button" disabled>
          <span data-i18n="counter.payBtn">Bayar</span> · <span id="payBtnAmt">RM0.00</span>
        </button>
      </div>
    </aside>
  </div>
</main>

<script src="config.js"></script>
<script src="menu-default.js"></script>
<script src="i18n.js"></script>
<script src="db.js"></script>
<script>
const H = KantinDB.h, { rm, money, esc, startClock, startOfDay, toast } = H;
const { t } = I18N;
startClock('today', 'now');
document.getElementById('brand').textContent = KantinDB.state.shopName;

const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
let MENU = { cats: [], items: [] }, cat = '__all', q = '', catInit = false;
let cart = [], override = null, note = '';

/* ---------------- cart persistence (survives an accidental refresh) */
const CART_KEY = 'hakaksado_cart';
try { const c = JSON.parse(sessionStorage.getItem(CART_KEY)); if (c && Array.isArray(c.cart)) { cart = c.cart; override = c.override; note = c.note || ''; } } catch (e) { }
const persist = () => { try { sessionStorage.setItem(CART_KEY, JSON.stringify({ cart, override, note })); } catch (e) { } };

/* ---------------- menu rendering (photo cards) */
const catStyleOf = c => KantinDB.catStyle(c, MENU.cats.indexOf(c));
const catColor = c => catStyleOf(c).c2;
function renderChips() {
  const all = [['__all', t('counter.chipAll'), '#fff'], ...MENU.cats.map(c => [c, c, catColor(c)])];
  $('chips').innerHTML = all.map(([k, label, col]) =>
    `<button class="chip${k === cat ? ' active' : ''}" role="tab" data-cat="${esc(k)}" style="--c:${col}">${k === '__all' ? '' : '<i></i>'}${esc(label)}</button>`
  ).join('');
}
/* `animate` is only true when the visible set of items actually changes (new
   category, new search, menu synced). Tapping +/− in the order panel also
   redraws the grid, and re-running the entrance stagger there would make the
   whole menu flicker on every tap. */
function renderItems(animate) {
  const inCart = {}; cart.forEach(l => inCart[l.id] = (inCart[l.id] || 0) + l.qty);
  const needle = q.trim().toLowerCase();
  let items = MENU.items.filter(it => !needle || it.name.toLowerCase().includes(needle));
  if (!needle && cat !== '__all') items = items.filter(it => it.cat === cat);
  const anim = animate && !REDUCED;
  let n = 0;
  const tile = it => {
    const st = catStyleOf(it.cat);
    const thumb = it.img ? `<img src="${esc(it.img)}" alt="" loading="lazy">` : esc(st.emoji);
    const delay = anim ? `;animation-delay:${Math.min(n++, 14) * 0.03}s` : '';
    return `<button class="item${anim ? ' fade-up' : ''}${inCart[it.id] ? ' picked' : ''}" type="button" data-id="${esc(it.id)}"
      style="--c1:${st.c1};--c2:${st.c2}${delay}">
      <div class="thumb">${thumb}</div>
      <div class="body"><b>${esc(it.name)}</b><span class="pr">${rm(it.price)}</span></div>
      <span class="plus" aria-hidden="true">+</span>
      ${inCart[it.id] ? `<span class="n">×${inCart[it.id]}</span>` : ''}
    </button>`;
  };
  let html = '';
  if (!items.length) html = `<div class="empty" style="grid-column:1/-1"><b>${t('counter.emptyTitle')}</b>${needle ? t('counter.emptyTrySearch') : t('counter.emptyAddMenu')}</div>`;
  else if (!needle && cat === '__all') {
    MENU.cats.forEach(c => {
      const list = items.filter(it => it.cat === c);
      if (!list.length) return;
      html += `<div class="cat-title" style="--c:${catColor(c)}"><i></i>${esc(c)}</div>` + list.map(tile).join('');
    });
  } else html = items.map(tile).join('');
  $('items').innerHTML = html;
}
$('chips').addEventListener('click', e => {
  const b = e.target.closest('[data-cat]'); if (!b) return;
  cat = b.dataset.cat; q = ''; $('q').value = '';
  renderChips(); renderItems(true);
  const active = $('chips').querySelector('.chip.active');
  if (active) active.scrollIntoView({ block: 'nearest', inline: 'center', behavior: REDUCED ? 'auto' : 'smooth' });
});
$('q').addEventListener('input', e => { q = e.target.value; renderItems(true); });
$('items').addEventListener('click', e => {
  const b = e.target.closest('[data-id]'); if (!b) return;
  const it = MENU.items.find(x => x.id === b.dataset.id);
  if (it) openDetail(it, b);
});

/* ---------------- the tile flies into the order panel when it is added
   Two steps on purpose: adding an item redraws the whole grid, which detaches
   the tile that was tapped. spawnGhost() must therefore run while the tile is
   still on screen; flyGhost() runs after the redraw, when the order panel is
   showing its new total. */
function spawnGhost(fromEl) {
  if (REDUCED || !fromEl || !fromEl.isConnected) return null;
  const a = fromEl.getBoundingClientRect();
  if (!a.width) return null;
  const ghost = fromEl.cloneNode(true);
  ghost.querySelectorAll('.ripple').forEach(r => r.remove());
  ghost.classList.add('fly-ghost');
  ghost.classList.remove('fade-up');
  ghost.style.cssText += `;left:${a.left}px;top:${a.top}px;width:${a.width}px;height:${a.height}px;margin:0;animation:none`;
  document.body.appendChild(ghost);
  return { ghost, a };
}
function flyGhost(g) {
  if (!g) return;
  const { ghost, a } = g;
  const sheetVisible = getComputedStyle($('sheetBar')).display !== 'none';
  const target = sheetVisible ? $('sbTotal') : $('tTotal');
  const b = target && target.getBoundingClientRect();
  if (!b || !b.width) { ghost.remove(); return; }
  const dx = (b.left + b.width / 2) - (a.left + a.width / 2);
  const dy = (b.top + b.height / 2) - (a.top + a.height / 2);
  requestAnimationFrame(() => {
    ghost.style.transform = `translate(${dx}px,${dy}px) scale(.16) rotate(8deg)`;
    ghost.style.opacity = '.1';
    ghost.style.borderRadius = '50%';
  });
  setTimeout(() => {
    ghost.remove();
    target.classList.add('bump');
    setTimeout(() => target.classList.remove('bump'), 400);
  }, 520);
}

/* ---------------- product detail (quantity + price for this sale only) */
function openDetail(it, sourceTile) {
  const st = catStyleOf(it.cat);
  const thumbHtml = it.img ? `<img src="${esc(it.img)}" alt="">` : esc(st.emoji);
  const already = cart.filter(l => l.id === it.id).reduce((a, l) => a + l.qty, 0);
  let qty = 1;
  const m = H.modal(`<div class="detail" style="--c1:${st.c1};--c2:${st.c2}">
    <div class="d-thumb">${thumbHtml}</div>
    <div>
      <h3>${esc(it.name)}</h3>
      <div class="d-price" id="dPrice">${rm(it.price)}</div>
      ${already ? `<div class="tag adj" style="margin-bottom:1rem">${t('counter.inOrder')} · ${already}</div>` : ''}
      <div class="d-block">
        <label>${t('counter.qty')}</label>
        <div class="qty-row">
          <button type="button" data-q="-1" aria-label="${t('counter.decrease')}">−</button>
          <b id="dQty">1</b>
          <button type="button" data-q="1" aria-label="${t('counter.increase')}">+</button>
        </div>
      </div>
      <div class="d-block" style="margin-bottom:0">
        <label>${t('counter.unitPrice')}</label>
        <input class="input" id="dPriceInput" type="number" step="0.01" min="0" inputmode="decimal" value="${it.price.toFixed(2)}" style="font-size:1.3rem;text-align:right">
        <div class="notes" style="margin-top:.7rem">
          <button type="button" data-dd="-0.5">−RM0.50</button>
          <button type="button" data-dd="-1">−RM1.00</button>
          <button type="button" data-dd="-2">−RM2.00</button>
          <button type="button" data-dd="reset">${t('counter.resetPrice')}</button>
        </div>
        <div class="hint" style="margin-top:.6rem">${t('counter.discountHint')}</div>
      </div>
    </div>
    <div class="foot">
      <div class="row" style="gap:.7rem;flex-wrap:nowrap">
        <button class="btn lg" type="button" data-x style="flex:none">${t('common.cancel')}</button>
        <button class="btn primary xl block" id="dAdd" type="button"></button>
      </div>
    </div>
  </div>`);
  const qtyEl = m.back.querySelector('#dQty'), priceInput = m.back.querySelector('#dPriceInput'),
    addBtn = m.back.querySelector('#dAdd'), priceLbl = m.back.querySelector('#dPrice');
  m.back.querySelector('.modal').style.width = 'min(46rem,100%)';
  function refresh(pop) {
    const price = Math.max(0, money(priceInput.value || 0));
    qtyEl.textContent = qty;
    if (pop && !REDUCED) { qtyEl.classList.remove('num-pop'); void qtyEl.offsetWidth; qtyEl.classList.add('num-pop'); }
    priceLbl.innerHTML = rm(price) + (Math.abs(price - it.price) > 0.001 ? ` <s>${rm(it.price)}</s>` : '');
    addBtn.textContent = t('counter.addToCart', { amt: rm(money(price * qty)) });
  }
  m.back.querySelectorAll('[data-q]').forEach(b => b.onclick = () => { qty = Math.max(1, qty + (+b.dataset.q)); refresh(true); });
  priceInput.addEventListener('input', () => refresh(false));
  m.back.querySelectorAll('[data-dd]').forEach(b => b.onclick = () => {
    if (b.dataset.dd === 'reset') priceInput.value = it.price.toFixed(2);
    else priceInput.value = Math.max(0, money(priceInput.value || 0) + (+b.dataset.dd)).toFixed(2);
    refresh(false);
  });
  m.back.querySelector('[data-x]').onclick = m.close;
  addBtn.onclick = () => {
    const g = spawnGhost(sourceTile);      // capture while the tile still exists
    m.close();
    addToCart(it, qty, money(priceInput.value || 0));
    flyGhost(g);
  };
  refresh(false);
}

/* ---------------- cart logic */
const subTotal = () => money(cart.reduce((a, l) => a + l.price * l.qty, 0));
const currentTotal = () => override != null ? money(override) : subTotal();
function cartChanged() {
  if (override != null) { override = null; note = ''; toast(t('counter.adjCancelled')); }
}
function addToCart(it, qty, price) {
  qty = Math.max(1, Math.round(qty || 1)); price = price == null ? it.price : Math.max(0, money(price));
  const l = cart.find(x => x.id === it.id && Math.abs(x.price - price) < 0.005);
  if (l) l.qty += qty; else cart.push({ id: it.id, name: it.name, cat: it.cat, price, orig: it.price, qty });
  cartChanged(); render();
  toast(t('counter.itemAdded', { name: it.name }), 'ok', 1400);
}

let seenKeys = new Set(), lastTotal = null;
function render(animate) {
  renderItems(animate);
  const n = cart.reduce((a, l) => a + l.qty, 0), sub = subTotal(), total = currentTotal();
  $('cartCount').textContent = n ? n + ' ' + t('counter.item') : '';

  const keys = new Set();
  $('lines').innerHTML = cart.length ? cart.map((l, i) => {
    const key = l.id + '@' + l.price.toFixed(2);
    keys.add(key);
    const fresh = seenKeys.has(key) ? '' : ' is-new';
    return `<div class="line${fresh}">
      <div class="nm">${esc(l.name)}</div>
      <div class="amt">${rm(l.price * l.qty)}</div>
      <button class="pr" type="button" data-price="${i}" title="${t('counter.priceForSaleTooltip')}">${rm(l.price)} × ${l.qty}${l.price !== l.orig ? ` <span class="tag adj">${t('counter.priceChangedTag')}</span>` : ''}</button>
      <div class="qty">
        <button type="button" data-dec="${i}" aria-label="${t('counter.decrease')}">−</button>
        <b>${l.qty}</b>
        <button type="button" data-inc="${i}" aria-label="${t('counter.increase')}">+</button>
        <button type="button" class="rmv" data-del="${i}" aria-label="${t('counter.remove')}">×</button>
      </div>
    </div>`;
  }).join('') : `<div class="empty"><span class="art" aria-hidden="true">🧺</span><b>${t('counter.cartEmptyTitle')}</b>${t('counter.cartEmptyDesc')}</div>`;
  seenKeys = keys;

  $('tSub').textContent = rm(sub);
  const adj = money(total - sub);
  $('tAdjRow').hidden = override == null;
  $('tAdj').textContent = (adj > 0 ? '+' : '') + rm(adj).replace('RM-', '−RM');
  $('tNote').textContent = note ? '· ' + note : '';
  $('adjBtn').textContent = override == null ? t('counter.changeTotal') : t('counter.resetTotal');

  const totalEl = $('tTotal');
  totalEl.textContent = rm(total);
  if (lastTotal != null && Math.abs(lastTotal - total) > 0.001 && !REDUCED) {
    totalEl.classList.remove('num-pop'); void totalEl.offsetWidth; totalEl.classList.add('num-pop');
  }
  lastTotal = total;

  $('sbTotal').textContent = rm(total);
  $('sbCount').textContent = n ? n + ' ' + t('counter.item') : t('counter.noItem');
  $('payBtnAmt').textContent = rm(total);
  $('openPayBtn').disabled = !cart.length;
  persist();
}
$('lines').addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.inc != null) { cart[+b.dataset.inc].qty++; cartChanged(); render(); }
  else if (b.dataset.dec != null) { const l = cart[+b.dataset.dec]; l.qty--; if (l.qty <= 0) cart.splice(+b.dataset.dec, 1); cartChanged(); render(); }
  else if (b.dataset.del != null) { cart.splice(+b.dataset.del, 1); cartChanged(); render(); }
  else if (b.dataset.price != null) {
    const l = cart[+b.dataset.price];
    const v = await H.prompt({ title: t('counter.priceForSaleTitle'), text: t('counter.priceForSaleText', { name: l.name, orig: rm(l.orig) }), label: t('counter.unitPriceRM'), type: 'number', value: l.price.toFixed(2), ok: t('counter.useThisPrice') });
    if (v == null) return;
    const p = money(v); if (p < 0) return;
    l.price = p; cartChanged(); render();
  }
});
$('clearBtn').addEventListener('click', async () => {
  if (!cart.length) return;
  if (await H.confirm({ title: t('counter.confirmClearTitle'), text: t('counter.confirmClearText'), ok: t('counter.clear'), danger: true })) resetCart();
});
function resetCart() { cart = []; override = null; note = ''; seenKeys = new Set(); render(); $('cart').classList.remove('open'); }

/* ---------------- adjust total */
$('adjBtn').addEventListener('click', () => {
  if (!cart.length) { toast(t('counter.addItemsFirst')); return; }
  if (override != null) { override = null; note = ''; render(); return; }
  const sub = subTotal();
  const m = H.modal(`<h3>${t('counter.adjTitle')}</h3><p>${t('counter.adjDesc')}</p>
    <form style="margin-top:1.1rem">
      <label class="field">${t('counter.newAmountLabel', { sub: rm(sub) })}<input class="input" id="adjAmt" type="number" step="0.01" min="0" inputmode="decimal" value="${sub.toFixed(2)}" style="font-size:1.6rem;text-align:right"></label>
      <div class="notes" style="margin:.8rem 0"><button type="button" data-d="-0.5">−RM0.50</button><button type="button" data-d="-1">−RM1.00</button><button type="button" data-d="-2">−RM2.00</button><button type="button" data-d="0">${t('counter.subtotal')}</button></div>
      <label class="field">${t('counter.reasonOptional')}<input class="input" id="adjNote" type="text" placeholder="${t('counter.reasonPlaceholder')}" value="${esc(note)}" maxlength="60"></label>
      <div class="actions"><button type="button" class="btn lg" data-x>${t('common.cancel')}</button><button type="submit" class="btn primary lg">${t('counter.saveAmount')}</button></div>
    </form>`);
  const amt = m.back.querySelector('#adjAmt');
  m.back.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { const d = +b.dataset.d; amt.value = (d === 0 ? sub : Math.max(0, money(amt.value) + d)).toFixed(2); amt.focus(); });
  m.back.querySelector('[data-x]').onclick = m.close;
  m.back.querySelector('form').onsubmit = ev => {
    ev.preventDefault();
    const v = money(amt.value); if (isNaN(v) || v < 0) return;
    override = v; note = m.back.querySelector('#adjNote').value.trim();
    m.close(); render();
  };
  setTimeout(() => { amt.focus(); amt.select(); }, 30);
});

/* ---------------- payment: full screen, methods on the left, keypad on the right */
async function finish(method, paid, change, total) {
  const subtotal = subTotal(); total = total == null ? currentTotal() : money(total);
  const sale = {
    items: cart.map(l => ({ name: l.name, price: l.price, qty: l.qty, cat: l.cat, orig: l.orig })),
    subtotal, total, adj: money(total - subtotal), note, method, paid: money(paid), change: money(change)
  };
  const saved = await KantinDB.addSale(sale);
  showReceipt(saved);
  resetCart();
}
$('openPayBtn').addEventListener('click', () => {
  if (!cart.length) { toast(t('counter.addItemsFirst')); return; }
  const total = currentTotal();
  let method = 'cash';
  const m = H.modal(`<div class="pay-screen">
    <h3>${t('counter.paymentTitle')}</h3>
    <div class="pay-grid">
      <div class="pay-col">
        <div class="due"><span>${t('counter.amountDue')}</span><b>${rm(total)}</b></div>
        <div class="method-list" id="methodList">
          <div class="method-row active" data-m="cash" role="button" tabindex="0"><div class="radio"><i></i></div><div class="ic">💵</div><b>${t('counter.methodCash')}</b></div>
          <div class="method-row" data-m="qr" role="button" tabindex="0"><div class="radio"><i></i></div><div class="ic">📱</div><b>${t('counter.methodQr')}</b></div>
        </div>
        <div class="change" id="payChangeBox"><span>${t('counter.change')}</span><b id="payChangeAmt">RM0.00</b></div>
        <div class="hint" id="payHint" hidden>${t('counter.qrConfirmHint')}</div>
      </div>
      <div class="pay-col">
        <input class="amt-display" id="payAmt" type="text" inputmode="decimal" value="${total.toFixed(2)}" aria-label="${t('counter.amountReceived')}">
        <div class="quick-amts" id="quickAmts">
          <button type="button" class="exact" data-exact>${t('counter.exact')}</button>
          <button type="button" data-add="1">+1</button>
          <button type="button" data-add="5">+5</button>
          <button type="button" data-add="10">+10</button>
          <button type="button" data-add="20">+20</button>
          <button type="button" data-add="50">+50</button>
          <button type="button" data-add="100">+100</button>
        </div>
        <div class="keypad" id="keypad">${['1', '2', '3', '4', '5', '6', '7', '8', '9', '.', '0', '⌫'].map(k => `<button type="button" data-k="${k}"${k === '⌫' ? ' class="op"' : ''}>${k}</button>`).join('')}</div>
      </div>
    </div>
    <div class="pay-actions">
      <button type="button" class="btn lg" data-x>${t('common.cancel')}</button>
      <button type="button" class="btn primary xl" id="payConfirm">${t('counter.confirmPay')}</button>
    </div>
  </div>`, 'full');
  const amtInput = m.back.querySelector('#payAmt'), changeBox = m.back.querySelector('#payChangeBox'),
    changeAmtEl = m.back.querySelector('#payChangeAmt'), confirmBtn = m.back.querySelector('#payConfirm'),
    payHint = m.back.querySelector('#payHint'), methodRows = m.back.querySelectorAll('.method-row');
  const curAmt = () => { const v = money(amtInput.value); return isNaN(v) ? 0 : v; };
  function refreshPay() {
    changeBox.hidden = method !== 'cash';
    payHint.hidden = method !== 'qr';
    const amt = curAmt();
    if (method === 'cash') {
      const diff = money(amt - total);
      if (diff < 0) {
        changeBox.className = 'change short';
        changeBox.firstElementChild.textContent = t('counter.insufficientCash');
        changeAmtEl.textContent = '−' + rm(-diff);
        confirmBtn.disabled = true;
      } else {
        changeBox.className = 'change';
        changeBox.firstElementChild.textContent = t('counter.change');
        changeAmtEl.textContent = rm(diff);
        confirmBtn.disabled = false;
      }
    } else confirmBtn.disabled = !(amt > 0);
  }
  const pick = r => { methodRows.forEach(x => x.classList.remove('active')); r.classList.add('active'); method = r.dataset.m; refreshPay(); };
  methodRows.forEach(r => {
    r.onclick = () => pick(r);
    r.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(r); } };
  });
  amtInput.addEventListener('input', () => { amtInput.value = amtInput.value.replace(/[^0-9.]/g, '').replace(/(\..*)\./g, '$1'); refreshPay(); });
  amtInput.addEventListener('keydown', e => { if (e.key === 'Enter' && !confirmBtn.disabled) confirmBtn.click(); });
  m.back.querySelector('#quickAmts').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.exact != null) amtInput.value = total.toFixed(2);
    else amtInput.value = money(curAmt() + (+b.dataset.add)).toFixed(2);
    refreshPay();
  });
  m.back.querySelector('#keypad').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const k = b.dataset.k;
    if (k === '⌫') amtInput.value = amtInput.value.slice(0, -1);
    else if (k === '.') { if (!amtInput.value.includes('.')) amtInput.value += '.'; }
    else { const dec = amtInput.value.split('.')[1]; if (!(dec && dec.length >= 2)) amtInput.value += k; }
    refreshPay();
  });
  m.back.querySelector('[data-x]').onclick = m.close;
  let saving = false;
  confirmBtn.onclick = () => {
    if (saving) return;
    const amt = curAmt();
    if (method === 'cash' && amt < total - 0.001) { toast(t('counter.insufficientCash'), 'err'); return; }
    if (method === 'qr' && !(amt > 0)) { toast(t('counter.enterValidAmount'), 'err'); return; }
    saving = true; confirmBtn.disabled = true;
    m.close();
    finish(method, amt, method === 'cash' ? money(amt - total) : 0, total);
  };
  refreshPay();
});

function showReceipt(s) {
  const isCash = s.method === 'cash';
  const m = H.modal(`<div class="receipt">
    <div>
      <div class="tick tick-anim"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12.5l5.2 5.2L20 7"/></svg></div>
      <h3>${t('counter.successTitle')}</h3>
    </div>
    <div class="rows">
      <div><span>${t('counter.totalBill')}</span><b>${rm(s.total)}</b></div>
      <div><span>${isCash ? t('counter.cashReceived') : t('counter.qrReceived')}</span><b>${rm(s.paid)}</b></div>
      ${isCash ? `<div class="grand"><span>${t('counter.changeDue')}</span><b>${rm(s.change)}</b></div>` : ''}
    </div>
    <div class="lines-mini">
      ${s.items.map(it => `<div><span>${esc(it.name)} × ${it.qty}</span><b>${rm(it.price * it.qty)}</b></div>`).join('')}
      ${s.adj ? `<div><span>${t('counter.adjustment')}${s.note ? ' · ' + esc(s.note) : ''}</span><b>${s.adj > 0 ? '+' : '−'}${rm(Math.abs(s.adj))}</b></div>` : ''}
    </div>
    <div class="actions">
      <button class="btn lg" data-print type="button">🖨️ ${t('counter.printReceipt')}</button>
      <button class="btn primary xl" data-noprint type="button">${t('counter.done')}</button>
    </div>
  </div>`, 'full');
  m.back.querySelector('[data-noprint]').onclick = m.close;
  m.back.querySelector('[data-print]').onclick = () => { printReceipt(s); m.close(); };
  setTimeout(() => m.back.querySelector('[data-noprint]').focus(), 30);
}
function printReceipt(s) {
  const isCash = s.method === 'cash';
  const body = `
    <h1>${esc(KantinDB.state.shopName)}</h1>
    <p class="c muted">${H.fmtDate(s.ts)} · ${H.fmtTime(s.ts)}</p>
    <hr>
    <table>${s.items.map(it => `<tr><td>${esc(it.name)} × ${it.qty}</td><td class="r">${rm(it.price * it.qty)}</td></tr>`).join('')}</table>
    <hr>
    <table>
      <tr><td>${t('counter.subtotal')}</td><td class="r">${rm(s.subtotal)}</td></tr>
      ${s.adj ? `<tr><td>${t('counter.adjustment')}</td><td class="r">${s.adj > 0 ? '+' : '−'}${rm(Math.abs(s.adj))}</td></tr>` : ''}
      <tr><td class="big">${t('counter.total')}</td><td class="r big">${rm(s.total)}</td></tr>
      <tr><td>${isCash ? t('counter.cashReceived') : t('counter.qrReceived')}</td><td class="r">${rm(s.paid)}</td></tr>
      ${isCash ? `<tr><td>${t('counter.changeDue')}</td><td class="r">${rm(s.change)}</td></tr>` : ''}
    </table>
    <hr>
    <p class="c">${t('counter.receiptShopThanks')}</p>`;
  H.printHtml(t('counter.receiptCashierCopy'), body);
}

/* ---------------- bottom sheet (portrait / phone) */
$('sheetBar').addEventListener('click', e => { if (!e.target.closest('#sbToggle')) $('cart').classList.toggle('open'); });
$('sbToggle').addEventListener('click', () => $('cart').classList.toggle('open'));
$('closeSheet').addEventListener('click', () => $('cart').classList.remove('open'));

/* ---------------- start */
render(true);
KantinDB.ready().then(() => {
  const want = params.get('cat');
  KantinDB.watchMenu(m => {
    MENU = m;
    if (!catInit) { catInit = true; if (want && MENU.cats.includes(want)) cat = want; }
    if (cat !== '__all' && !MENU.cats.includes(cat)) cat = '__all';
    renderChips(); render(true);
  });
  KantinDB.watchSales({ from: +startOfDay(new Date()) }, sales => {
    const tot = money(sales.reduce((a, s) => a + s.total, 0));
    $('todayPill').innerHTML = t('counter.todayPill', { total: rm(tot), n: sales.length });
  });
});
</script>
</body>
