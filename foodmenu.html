<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kaunter Bayaran — Kantin Dapo Hakaksado</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="app.css" />
<style>
  main{max-width:1400px}
  .today-pill{display:inline-flex;align-items:center;gap:8px;background:rgba(235,90,15,.14);border:1px solid rgba(235,90,15,.35);border-radius:999px;padding:8px 14px;font-size:.78rem;font-weight:800;color:#ffc59f;text-decoration:none;white-space:nowrap}
  .today-pill b{color:#fff;font-variant-numeric:tabular-nums}
  .pos{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:20px;align-items:start}

  /* ---------- menu side ---------- */
  .tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .search{position:relative;flex:1;min-width:200px}
  .search .input{padding-left:38px}
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round}
  .chips{margin-bottom:16px}
  .chip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px;background:var(--c,#fff)}
  .items{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .cat-title{grid-column:1/-1;font-size:.76rem;font-weight:800;color:var(--muted);margin:10px 0 -2px;display:flex;align-items:center;gap:8px}
  .cat-title i{width:8px;height:8px;border-radius:50%;background:var(--c)}
  .cat-title:first-child{margin-top:0}
  .item{position:relative;text-align:left;background:rgba(255,255,255,.05);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:14px;padding:12px 12px 10px;cursor:pointer;min-height:78px;display:flex;flex-direction:column;justify-content:space-between;gap:6px;transition:background .15s,transform .1s;color:#fff}
  .item:hover{background:rgba(255,255,255,.1)}
  .item:active{transform:scale(.96)}
  .item b{font-size:.88rem;font-weight:800;line-height:1.25}
  .item span{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:700}
  .item .n{position:absolute;top:-8px;right:-6px;background:var(--orange);color:#fff;border-radius:999px;min-width:24px;height:24px;padding:0 7px;display:grid;place-items:center;font-size:.72rem;font-weight:800;box-shadow:0 4px 10px rgba(0,0,0,.35)}

  /* ---------- cart ---------- */
  .cart{position:sticky;top:20px;background:var(--panel);border:1px solid var(--line);border-radius:22px;display:flex;flex-direction:column;max-height:calc(100vh - 40px);box-shadow:0 14px 30px rgba(0,0,0,.28)}
  .sheet-bar{display:none;height:70px;padding:0 18px;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;flex:none}
  .sheet-bar .sum{font-weight:800;font-size:.9rem}
  .sheet-bar .sum small{display:block;color:var(--muted);font-size:.74rem;font-weight:700}
  .cart-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 8px;flex:none}
  .cart-head h2{font-size:1rem;font-weight:800}
  .cart-head h2 small{color:var(--muted);font-weight:700;font-size:.76rem;margin-left:6px}
  .lines{flex:1 1 auto;overflow:auto;padding:0 10px;min-height:70px}
  .line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:10px 8px;align-items:center}
  .line+.line{border-top:1px solid var(--line)}
  .line .nm{font-weight:800;font-size:.88rem;line-height:1.2;overflow-wrap:anywhere}
  .line .pr{font-size:.76rem;color:var(--muted);font-weight:700;cursor:pointer;display:inline-flex;gap:6px;align-items:center;background:none;border:0;padding:0;border-bottom:1px dashed rgba(255,255,255,.3);justify-self:start}
  .line .pr:hover{color:#fff}
  .line .amt{font-weight:800;font-variant-numeric:tabular-nums;text-align:right;font-size:.95rem}
  .qty{display:inline-flex;align-items:center;gap:3px;justify-self:end}
  .qty button{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:#fff;font-weight:800;cursor:pointer;font-size:1.05rem;display:grid;place-items:center;line-height:1}
  .qty button:hover{background:rgba(255,255,255,.14)}
  .qty b{min-width:28px;text-align:center;font-variant-numeric:tabular-nums}
  .qty .rmv{color:#ffb3af;margin-left:4px;border-color:rgba(240,98,92,.3);background:rgba(240,98,92,.12);font-size:.9rem}
  .totals{padding:10px 18px 0;border-top:1px solid var(--line);flex:none}
  .trow{display:flex;justify-content:space-between;align-items:center;font-size:.82rem;color:var(--muted);font-weight:700;padding:3px 0;gap:10px}
  .trow.big{font-size:1rem;color:#fff;padding-top:6px}
  .trow.big b{font-size:1.65rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
  .trow .adj{color:#8fe9be}
  .linkbtn{background:none;border:0;color:var(--orange-2);font-weight:800;font-size:.78rem;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}
  .pay{padding:10px 18px 18px;display:flex;flex-direction:column;gap:10px;flex:none}
  .cash-row{display:flex;gap:8px;align-items:center}
  .cash-row .input{font-size:1.15rem;padding:11px 14px}
  .notes{display:flex;gap:6px;flex-wrap:wrap}
  .notes button{border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff;border-radius:999px;padding:6px 11px;font-size:.76rem;font-weight:800;cursor:pointer}
  .notes button:hover{background:rgba(255,255,255,.12)}
  .change{display:flex;justify-content:space-between;align-items:center;background:rgba(62,207,142,.1);border:1px solid rgba(62,207,142,.25);border-radius:12px;padding:9px 14px;font-weight:800;font-size:.84rem}
  .change.short{background:rgba(240,98,92,.1);border-color:rgba(240,98,92,.3);color:#ffb3af}
  .change b{font-size:1.25rem;font-variant-numeric:tabular-nums}
  .paybtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .hint{font-size:.72rem;color:var(--muted);font-weight:700}

  /* ---------- receipt ---------- */
  .receipt{text-align:center}
  .receipt .tick{width:64px;height:64px;border-radius:50%;background:var(--green);color:#0f2b1f;display:grid;place-items:center;font-size:2rem;font-weight:800;margin:0 auto 12px}
  .receipt .big{margin:14px 0;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:16px;padding:14px}
  .receipt .big span{display:block;color:var(--muted);font-size:.78rem;font-weight:700}
  .receipt .big b{font-size:2.4rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
  .receipt .rc{text-align:left;font-size:.82rem;max-height:160px;overflow:auto;padding:0 4px}
  .receipt .rc div{display:flex;justify-content:space-between;gap:10px;padding:3px 0;color:var(--muted)}
  .receipt .rc div b{color:#fff;font-variant-numeric:tabular-nums}

  @media (max-width:1000px){
    .pos{grid-template-columns:1fr}
    main{padding-bottom:120px}
    .cart{position:fixed;left:84px;right:0;bottom:0;top:auto;max-height:none;border-radius:22px 22px 0 0;transform:translateY(calc(100% - 70px));transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:55;box-shadow:0 -10px 30px rgba(0,0,0,.45);height:88vh;height:88dvh}
    .cart.open{transform:translateY(0)}
    .cart.open .sheet-bar{display:none}
    .sheet-bar{display:flex}
    .cart-head .close{display:inline-flex}
  }
  @media (min-width:1001px){ .cart-head .close{display:none} }
  @media (max-width:720px){
    .cart{left:0;bottom:68px;height:calc(88vh - 68px);height:calc(88dvh - 68px)}
    main{padding-bottom:170px}
    .items{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
  }
  @media (max-width:420px){ .notes [data-add="2"],.notes [data-add="100"]{display:none} }
</style>
</head>

<main>
  <div class="head">
    <div>
      <div class="brand" id="brand">Kantin Dapo Hakaksado</div>
      <h1><b>Kaunter</b> Bayaran</h1>
    </div>
    <div class="head-right">
      <a class="today-pill" id="todayPill" href="salesdata.html?p=day">Hari ini <b>RM0.00</b> · 0 transaksi</a>
      <a id="syncBadge" class="sync" href="settings.html"><i></i>Memuatkan…</a>
      <div class="clock"><span id="today">—</span><b id="now">--:--:--</b></div>
    </div>
  </div>

  <div class="pos">
    <section class="menu-area" aria-label="Pilih makanan">
      <div class="tools">
        <label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input class="input" id="q" type="search" placeholder="Cari makanan atau minuman…" autocomplete="off"></label>
        <a class="btn sm" href="menu.html">Urus menu</a>
      </div>
      <div class="chips" id="chips" role="tablist"></div>
      <div class="items" id="items"></div>
    </section>

    <aside class="cart" id="cart" aria-label="Pesanan">
      <div class="sheet-bar" id="sheetBar">
        <div class="sum"><span id="sbTotal">RM0.00</span><small id="sbCount">Tiada item</small></div>
        <button class="btn primary" id="sbToggle" type="button">Bayar ▴</button>
      </div>
      <div class="cart-head">
        <h2>Pesanan <small id="cartCount"></small></h2>
        <div class="row" style="gap:6px">
          <button class="btn sm ghost" id="clearBtn" type="button">Kosongkan</button>
          <button class="btn sm close" id="closeSheet" type="button" aria-label="Tutup">▾</button>
        </div>
      </div>
      <div class="lines" id="lines"></div>
      <div class="totals">
        <div class="trow"><span>Subtotal</span><span id="tSub">RM0.00</span></div>
        <div class="trow" id="tAdjRow" hidden><span>Pelarasan <span class="muted" id="tNote"></span></span><span class="adj" id="tAdj"></span></div>
        <div class="trow"><span></span><button class="linkbtn" id="adjBtn" type="button">Ubah jumlah</button></div>
        <div class="trow big"><span>Jumlah</span><b id="tTotal">RM0.00</b></div>
      </div>
      <div class="pay">
        <div class="cash-row">
          <input class="input" id="cash" type="number" inputmode="decimal" step="0.01" min="0" placeholder="Tunai diterima (RM)" aria-label="Tunai diterima">
          <button class="btn sm" id="cashClear" type="button" aria-label="Kosongkan tunai">×</button>
        </div>
        <div class="notes" id="notes">
          <button type="button" data-exact>Tepat</button>
          <button type="button" data-add="1">+1</button>
          <button type="button" data-add="2">+2</button>
          <button type="button" data-add="5">+5</button>
          <button type="button" data-add="10">+10</button>
          <button type="button" data-add="20">+20</button>
          <button type="button" data-add="50">+50</button>
          <button type="button" data-add="100">+100</button>
        </div>
        <div class="change" id="change"><span>Baki pelanggan</span><b id="changeAmt">RM0.00</b></div>
        <div class="paybtns">
          <button class="btn primary lg" id="payCash" type="button" disabled>Terima Tunai</button>
          <button class="btn qr lg" id="payQr" type="button" disabled>Bayar QR</button>
        </div>
        <div class="hint">Tunai kosong = bayaran tepat. QR: sahkan selepas pelanggan berjaya bayar.</div>
      </div>

<script>
const H = KantinDB.h, { rm, money, esc, startClock, startOfDay, toast } = H;
startClock('today', 'now');
document.getElementById('brand').textContent = KantinDB.state.shopName;

const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
let MENU = { cats: [], items: [] }, cat = '__all', q = '', catInit = false;
let cart = [], override = null, note = '';

/* ---------------- cart persistence (survives an accidental refresh) */
const CART_KEY = 'hakaksado_cart';
try { const c = JSON.parse(sessionStorage.getItem(CART_KEY)); if (c && Array.isArray(c.cart)) { cart = c.cart; override = c.override; note = c.note || ''; } } catch (e) { }
const persist = () => { try { sessionStorage.setItem(CART_KEY, JSON.stringify({ cart, override, note })); } catch (e) { } };

/* ---------------- menu rendering */
const catColor = c => { const i = MENU.cats.indexOf(c); return KantinDB.catStyle(c, i < 0 ? 0 : i).c2; };
function renderChips() {
  const all = [['__all', 'Semua', '#fff'], ...MENU.cats.map(c => [c, c, catColor(c)])];
  $('chips').innerHTML = all.map(([k, label, col]) => `<button class="chip${k === cat ? ' active' : ''}" role="tab" data-cat="${esc(k)}" style="--c:${col}">${k === '__all' ? '' : '<i></i>'}${esc(label)}</button>`).join('');
}
function renderItems() {
  const inCart = {}; cart.forEach(l => inCart[l.id] = (inCart[l.id] || 0) + l.qty);
  const needle = q.trim().toLowerCase();
  let items = MENU.items.filter(it => !needle || it.name.toLowerCase().includes(needle));
  if (!needle && cat !== '__all') items = items.filter(it => it.cat === cat);
  const tile = it => `<button class="item" type="button" data-id="${esc(it.id)}" style="--c:${catColor(it.cat)}"><b>${esc(it.name)}</b><span>${rm(it.price)}</span>${inCart[it.id] ? `<span class="n">×${inCart[it.id]}</span>` : ''}</button>`;
  let html = '';
  if (!items.length) html = `<div class="empty" style="grid-column:1/-1"><b>Tiada item</b>${needle ? 'Cuba carian lain.' : 'Tambah item di halaman Menu.'}</div>`;
  else if (!needle && cat === '__all') {
    MENU.cats.forEach(c => { const list = items.filter(it => it.cat === c); if (!list.length) return; html += `<div class="cat-title" style="--c:${catColor(c)}"><i></i>${esc(c)}</div>` + list.map(tile).join(''); });
  } else html = items.map(tile).join('');
  $('items').innerHTML = html;
}
$('chips').addEventListener('click', e => { const b = e.target.closest('[data-cat]'); if (!b) return; cat = b.dataset.cat; q = ''; $('q').value = ''; renderChips(); renderItems(); });
$('q').addEventListener('input', e => { q = e.target.value; renderItems(); });
$('items').addEventListener('click', e => { const b = e.target.closest('[data-id]'); if (!b) return; const it = MENU.items.find(x => x.id === b.dataset.id); if (it) addToCart(it); });

/* ---------------- cart logic */
const subTotal = () => money(cart.reduce((a, l) => a + l.price * l.qty, 0));
const currentTotal = () => override != null ? money(override) : subTotal();
function cartChanged() {
  if (override != null) { override = null; note = ''; toast('Jumlah ubah dibatalkan kerana pesanan berubah'); }
}
function addToCart(it) {
  const l = cart.find(x => x.id === it.id);
  if (l) l.qty++; else cart.push({ id: it.id, name: it.name, cat: it.cat, price: it.price, orig: it.price, qty: 1 });
  cartChanged(); render();
}
function render() {
  renderItems();
  const n = cart.reduce((a, l) => a + l.qty, 0), sub = subTotal(), total = currentTotal();
  $('cartCount').textContent = n ? n + ' item' : '';
  $('lines').innerHTML = cart.length ? cart.map((l, i) => `
    <div class="line">
      <div class="nm">${esc(l.name)}</div>
      <div class="amt">${rm(l.price * l.qty)}</div>
      <button class="pr" type="button" data-price="${i}" title="Tukar harga untuk transaksi ini">${rm(l.price)} × ${l.qty}${l.price !== l.orig ? ' <span class="tag adj">ubah</span>' : ''}</button>
      <div class="qty"><button type="button" data-dec="${i}" aria-label="Kurang">−</button><b>${l.qty}</b><button type="button" data-inc="${i}" aria-label="Tambah">+</button><button type="button" class="rmv" data-del="${i}" aria-label="Buang">×</button></div>
    </div>`).join('') : `<div class="empty"><b>Tiada pesanan lagi</b>Klik makanan di sebelah untuk mula.</div>`;
  $('tSub').textContent = rm(sub);
  const adj = money(total - sub);
  $('tAdjRow').hidden = override == null;
  $('tAdj').textContent = (adj > 0 ? '+' : '') + rm(adj).replace('RM-', '−RM');
  $('tNote').textContent = note ? '· ' + note : '';
  $('adjBtn').textContent = override == null ? 'Ubah jumlah' : 'Tetapkan semula jumlah';
  $('tTotal').textContent = rm(total);
  $('sbTotal').textContent = rm(total);
  $('sbCount').textContent = n ? n + ' item' : 'Tiada item';
  $('payCash').disabled = !cart.length;
  $('payQr').disabled = !cart.length;
  renderChange();
  persist();
}
$('lines').addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.inc != null) { cart[+b.dataset.inc].qty++; cartChanged(); render(); }
  else if (b.dataset.dec != null) { const l = cart[+b.dataset.dec]; l.qty--; if (l.qty <= 0) cart.splice(+b.dataset.dec, 1); cartChanged(); render(); }
  else if (b.dataset.del != null) { cart.splice(+b.dataset.del, 1); cartChanged(); render(); }
  else if (b.dataset.price != null) {
    const l = cart[+b.dataset.price];
    const v = await H.prompt({ title: 'Harga untuk transaksi ini', text: `Harga asal ${l.name}: ${rm(l.orig)}. Harga menu tidak berubah — hanya pesanan ini.`, label: 'Harga seunit (RM)', type: 'number', value: l.price.toFixed(2), ok: 'Guna harga ini' });
    if (v == null) return;
    const p = money(v); if (p < 0) return;
    l.price = p; cartChanged(); render();
  }
});
$('clearBtn').addEventListener('click', async () => {
  if (!cart.length) return;
  if (await H.confirm({ title: 'Kosongkan pesanan?', text: 'Semua item dalam pesanan ini akan dibuang.', ok: 'Kosongkan', danger: true })) resetCart();
});
function resetCart() { cart = []; override = null; note = ''; $('cash').value = ''; render(); $('cart').classList.remove('open'); }

/* ---------------- adjust total */
$('adjBtn').addEventListener('click', () => {
  if (!cart.length) { toast('Tambah item dahulu'); return; }
  if (override != null) { override = null; note = ''; render(); return; }
  const sub = subTotal();
  const m = H.modal(`<h3>Ubah jumlah bayaran</h3><p>Guna apabila pelanggan ambil porsi kecil atau diberi diskaun. Harga menu tidak berubah — hanya transaksi ini.</p>
    <form style="margin-top:14px">
      <label class="field">Jumlah baru (RM) — subtotal ${rm(sub)}<input class="input" id="adjAmt" type="number" step="0.01" min="0" inputmode="decimal" value="${sub.toFixed(2)}" style="font-size:1.3rem"></label>
      <div class="notes" style="margin:10px 0"><button type="button" data-d="-0.5">−RM0.50</button><button type="button" data-d="-1">−RM1.00</button><button type="button" data-d="-2">−RM2.00</button><button type="button" data-d="0">Subtotal</button></div>
      <label class="field">Sebab (pilihan)<input class="input" id="adjNote" type="text" placeholder="cth. porsi kecil, diskaun" value="${esc(note)}" maxlength="60"></label>
      <div class="actions"><button type="button" class="btn" data-x>Batal</button><button type="submit" class="btn primary">Simpan jumlah</button></div>
    </form>`);
  const amt = m.back.querySelector('#adjAmt');
  m.back.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { const d = +b.dataset.d; amt.value = (d === 0 ? sub : Math.max(0, money(amt.value) + d)).toFixed(2); amt.focus(); });
  m.back.querySelector('[data-x]').onclick = m.close;
  m.back.querySelector('form').onsubmit = ev => {
    ev.preventDefault();
    const v = money(amt.value); if (isNaN(v) || v < 0) return;
    override = v; note = m.back.querySelector('#adjNote').value.trim();
    m.close(); render();
  };
  setTimeout(() => { amt.focus(); amt.select(); }, 30);
});

/* ---------------- cash */
const cashVal = () => { const raw = $('cash').value.trim(); return raw === '' ? null : money(raw); };
function renderChange() {
  const total = currentTotal(), paid = cashVal();
  const box = $('change');
  if (paid == null) { box.className = 'change'; box.firstElementChild.textContent = 'Baki pelanggan (bayaran tepat)'; $('changeAmt').textContent = rm(0); $('payCash').disabled = !cart.length; return; }
  const diff = money(paid - total);
  if (diff < 0) { box.className = 'change short'; box.firstElementChild.textContent = 'Tunai tidak mencukupi'; $('changeAmt').textContent = '−' + rm(-diff); $('payCash').disabled = true; }
  else { box.className = 'change'; box.firstElementChild.textContent = 'Baki pelanggan'; $('changeAmt').textContent = rm(diff); $('payCash').disabled = !cart.length; }
}
$('cash').addEventListener('input', renderChange);
$('cash').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); if (!$('payCash').disabled) payCash(); } });
$('cashClear').addEventListener('click', () => { $('cash').value = ''; renderChange(); $('cash').focus(); });
$('notes').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.exact != null) $('cash').value = currentTotal().toFixed(2);
  else $('cash').value = money((cashVal() || 0) + +b.dataset.add).toFixed(2);
  renderChange();
});

/* ---------------- payment */
async function finish(method, paid, change, total) {
  const subtotal = subTotal(); total = total == null ? currentTotal() : money(total);
  const sale = {
    items: cart.map(l => ({ name: l.name, price: l.price, qty: l.qty, cat: l.cat, orig: l.orig })),
    subtotal, total, adj: money(total - subtotal), note, method, paid: money(paid), change: money(change)
  };
  const saved = await KantinDB.addSale(sale);
  showReceipt(saved);
  resetCart();
}
function payCash() {
  if (!cart.length) return;
  const total = currentTotal(); const paid = cashVal() == null ? total : cashVal();
  if (paid < total - 0.001) { toast('Tunai tidak mencukupi', 'err'); return; }
  finish('cash', paid, money(paid - total));
}
$('payCash').addEventListener('click', payCash);
$('payQr').addEventListener('click', () => {
  if (!cart.length) return;
  const total = currentTotal();
  const m = H.modal(`<h3>Bayaran QR</h3><p>Pastikan pelanggan telah mengimbas QR kedai dan bayaran <b>berjaya</b> sebelum sahkan. Jumlah boleh diubah jika pelanggan bayar amaun berbeza.</p>
    <form style="margin-top:14px">
      <label class="field">Jumlah diterima melalui QR (RM)<input class="input" id="qrAmt" type="number" step="0.01" min="0.01" inputmode="decimal" value="${total.toFixed(2)}" style="font-size:1.4rem"></label>
      <div class="actions"><button type="button" class="btn" data-x>Batal</button><button type="submit" class="btn qr lg">Sahkan bayaran QR</button></div>
    </form>`);
  const amt = m.back.querySelector('#qrAmt');
  m.back.querySelector('[data-x]').onclick = m.close;
  m.back.querySelector('form').onsubmit = ev => {
    ev.preventDefault();
    const v = money(amt.value); if (!(v > 0)) { toast('Masukkan jumlah yang sah', 'err'); return; }
    m.close(); finish('qr', v, 0, v);
  };
  setTimeout(() => { amt.focus(); amt.select(); }, 30);
});
function showReceipt(s) {
  const m = H.modal(`<div class="receipt">
    <div class="tick">✓</div><h3>Bayaran diterima</h3>
    <span class="tag ${s.method}">${s.method === 'qr' ? 'QR Pay' : 'Tunai'}</span>
    <div class="big"><span>${s.method === 'cash' ? 'Baki untuk pelanggan' : 'Jumlah dibayar melalui QR'}</span><b>${rm(s.method === 'cash' ? s.change : s.total)}</b></div>
    <div class="rc">${s.items.map(it => `<div><span>${esc(it.name)} × ${it.qty}</span><b>${rm(it.price * it.qty)}</b></div>`).join('')}
      ${s.adj ? `<div><span>Pelarasan${s.note ? ' · ' + esc(s.note) : ''}</span><b>${s.adj > 0 ? '+' : '−'}${rm(Math.abs(s.adj))}</b></div>` : ''}
      <div style="border-top:1px solid var(--line);margin-top:4px;padding-top:6px"><span>Jumlah</span><b>${rm(s.total)}</b></div>
      ${s.method === 'cash' ? `<div><span>Tunai diterima</span><b>${rm(s.paid)}</b></div>` : ''}
    </div>
    <div class="actions" style="justify-content:stretch"><button class="btn primary lg block" data-ok type="button">Transaksi baru</button></div>
  </div>`);
  const ok = m.back.querySelector('[data-ok]'); ok.onclick = m.close; setTimeout(() => ok.focus(), 30);
}

/* ---------------- mobile sheet */
$('sheetBar').addEventListener('click', e => { if (!e.target.closest('#sbToggle')) $('cart').classList.toggle('open'); });
$('sbToggle').addEventListener('click', () => $('cart').classList.toggle('open'));
$('closeSheet').addEventListener('click', () => $('cart').classList.remove('open'));

/* ---------------- start */
render();
KantinDB.ready().then(() => {
  const want = params.get('cat');
  KantinDB.watchMenu(m => {
    MENU = m;
    if (!catInit) { catInit = true; if (want && MENU.cats.includes(want)) cat = want; }
    if (cat !== '__all' && !MENU.cats.includes(cat)) cat = '__all';
    renderChips(); render();
  });
  KantinDB.watchSales({ from: +startOfDay(new Date()) }, sales => {
    const tot = money(sales.reduce((a, s) => a + s.total, 0));
    $('todayPill').innerHTML = `Hari ini <b>${rm(tot)}</b> · ${sales.length} transaksi`;
  });
});
</script>
</body>
</html>
